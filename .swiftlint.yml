included:
  - Sources
  - Tests
disabled_rules:
  - todo
  # SwiftFormat's `trailingCommas` rule ADDS the trailing comma that SwiftLint's
  # `trailing_comma` rule removes, and both run in CI. SwiftFormat wins: it is
  # the formatter, and it rewrites files rather than only reporting.
  - trailing_comma
line_length: 120
identifier_name:
  # Names the domain and the plan's Signatures block fix: the Fitzpatrick skin
  # types are roman numerals, a lasting-colour answer is yes/aLittle/no, and `k`
  # is the calibration constant by that name throughout the design.
  # `id` is SwiftLint's own default exclusion; setting this list replaces it.
  # `to` and `n` are the plan's declared labels too: `multiplierMoved(from:to:)`,
  # `blisterCorrection(from:to:)` and `weight(n:isBurn:)` are written blind by
  # the test author from the Signatures block, so they are not ours to rename.
  excluded:
    - id
    - to
    - n
    - i
    - ii
    - iv
    - v
    - vi
    - no
    - k
file_length:
  # Count code, not commentary: a test file that explains each promise it
  # asserts is not too long for having said why. The formatter's wrap rules
  # (0.63) also lengthen files without adding a line of logic. The plans put
  # one model or one slice's tests in one file by name (ExposureModel, the
  # Planner tests, the use-case fixtures), so the template's 400 is raised;
  # SwiftLint 0.65 on the runner also counts more lines than 0.57 does here.
  ignore_comment_only_lines: true
  warning: 700
  error: 900
