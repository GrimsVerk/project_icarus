<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAW</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --w:#ffffff; --k:#000000; --y:#d4ff00; --r:#ff2e00; --g:#6b6b6b;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --big:"Anton","Archivo Black",Impact,sans-serif;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono","Space Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-radius:0}
html,body{margin:0;height:100%;background:var(--w);color:var(--k)}
body{font-family:var(--sans);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden;background:var(--w);isolation:isolate}
@media (min-width:600px){
  body{background:#1a1a1a;display:grid;place-items:center}
  #app{position:relative;inset:auto;width:390px;height:844px;outline:10px solid #000;--sat:50px;--sab:28px}
}
.m{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tab{font-variant-numeric:tabular-nums}

/* top bar + corner square */
.bar{position:absolute;left:0;right:0;top:0;z-index:50;height:calc(var(--sat) + 56px);padding-top:var(--sat);background:var(--w);border-bottom:4px solid var(--k);display:flex;align-items:stretch}
.bar .lab{flex:1;display:flex;align-items:center;gap:10px;padding:0 0 0 16px;font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;min-width:0}
.bar .lab b{font-family:var(--big);font-weight:400;font-size:30px;letter-spacing:0;line-height:1}
.bar .back{width:64px;display:grid;place-items:center;border-right:4px solid var(--k);font-family:var(--big);font-size:30px}
.bar .back:active{background:var(--k);color:var(--w)}
.sq{width:60px;background:var(--k);color:var(--w);display:grid;place-items:center;flex:none}
.sq i{display:block;width:26px;height:4px;background:currentColor;box-shadow:0 -9px 0 currentColor,0 9px 0 currentColor}
.sq:active{background:var(--y);color:var(--k)}
.bar.inv{background:var(--k);color:var(--w);border-color:var(--w)}
.bar.inv .sq{background:var(--w);color:var(--k)}
.bar.inv .back{border-color:var(--w)}

/* views */
.view{position:absolute;left:0;right:0;bottom:0;top:calc(var(--sat) + 56px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--w);display:none;padding-bottom:calc(var(--sab) + 24px)}
.view.on{display:block}
.view.cut{animation:cut .16s steps(2,jump-none) both}
@keyframes cut{0%{filter:invert(1)}100%{filter:none}}
.view.dark{background:var(--k);color:var(--w)}

/* blocks */
.blk{border-bottom:4px solid var(--k);padding:16px}
.blk.k{background:var(--k);color:var(--w);border-color:var(--k)}
.blk.tight{padding:12px 16px}
.lbl{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
.lbl span:last-child{color:var(--g)}
.blk.k .lbl span:last-child{color:#9a9a9a}
.lbl[data-w] span:last-child{color:var(--w)}
.giant{font-family:var(--big);font-weight:400;line-height:.86;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.h1{font-family:var(--big);font-weight:400;font-size:64px;line-height:.9;text-transform:uppercase;margin:6px 0 4px;letter-spacing:.005em;overflow-wrap:anywhere}
.lead{font-family:var(--sans);font-weight:900;font-size:26px;line-height:1.05;letter-spacing:-.02em;margin:10px 0 6px}
.sub{font-size:16px;line-height:1.4;margin:0}
.blk.k .sub{color:#cfcfcf}

/* time input */
.time{display:grid;grid-template-columns:76px 1fr;border-bottom:4px solid var(--k)}
.time .dig{padding:12px 0 10px 16px;touch-action:none;cursor:ns-resize;position:relative;user-select:none;-webkit-user-select:none}
.time .dig .giant{font-size:132px;display:block;margin-top:6px}
.time .dig.drag{background:var(--k);color:var(--y)}
.time .dig .hint{position:absolute;right:12px;top:14px;font-family:var(--mono);font-size:10px;color:var(--g)}
.time .pm{display:grid;grid-template-rows:1fr 1fr;border-right:4px solid var(--k);order:-1}
.time .pm button{font-family:var(--sans);font-weight:900;font-size:46px;line-height:1;display:grid;place-items:center;min-height:64px}
.time .pm button+button{border-top:4px solid var(--k)}
.time .pm button:active{background:var(--k);color:var(--y)}
.dur{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-bottom:4px solid var(--k);background:var(--k);color:var(--w)}
.dur b{font-family:var(--big);font-weight:400;font-size:26px;letter-spacing:.01em}

.two{display:block;width:100%;padding:16px;min-height:76px;border-bottom:4px solid var(--w);background:var(--k);color:var(--w);position:relative;text-align:left}
.two .t{font-family:var(--sans);font-weight:900;font-size:22px;line-height:1.05;text-transform:uppercase;letter-spacing:-.01em;display:block;padding-right:70px}
.two .f{display:block;font-size:14px;line-height:1.35;margin-top:6px;color:#bdbdbd;padding-right:56px}
.two .st{position:absolute;right:14px;top:14px;font-family:var(--big);font-size:30px;line-height:1}
.two.on{background:var(--y);color:var(--k)}
.two.on .f{color:#2a2a2a}
.two:active{background:var(--w);color:var(--k)}
.two.on:active{background:var(--k);color:var(--y)}
.slab{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:var(--y);color:var(--k);padding:0 16px;min-height:96px;border-bottom:4px solid var(--k);font-family:var(--big);font-size:42px;line-height:.95;text-transform:uppercase;text-align:left}
.slab .ar{font-size:54px}
.slab:active,.slab.flash{background:var(--k);color:var(--y)}
.slab.small{min-height:72px;font-size:34px}
.slab.k{background:var(--k);color:var(--w)}
.slab.k:active{background:var(--w);color:var(--k)}
.slab.w{background:var(--w);color:var(--k)}
.slab.w:active{background:var(--k);color:var(--w)}
.slab.r{background:var(--r);color:var(--w)}
.slab:disabled{opacity:.3}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;padding:12px 16px;border-bottom:4px solid var(--k);text-align:left;font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:-.005em}
.row .v{font-family:var(--mono);font-size:12px;font-weight:700;flex:none}
.row:active{background:var(--k);color:var(--w)}
.row.due{background:var(--w)}
.row.due{justify-content:flex-start}
.row.due span:first-child{flex:1}
.row.due:before{content:"";flex:none;width:16px;height:16px;background:var(--r);order:-1}
.split{display:grid;grid-template-columns:1fr 1fr;border-bottom:4px solid var(--k)}
.split>*{border-bottom:0}
.split>*+*{border-left:4px solid var(--k)}
.ad{margin:16px;border:2px dashed var(--k);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 0 0 12px}
.ad button{width:44px;height:44px;display:grid;place-items:center;font-family:var(--mono);font-weight:800;border-left:2px dashed var(--k);height:100%}

/* index overlay */
#idx{position:absolute;inset:0;z-index:400;background:var(--k);color:var(--w);display:none;flex-direction:column;padding-top:calc(var(--sat) + 56px)}
#idx.on{display:flex}
#idx .ib{position:absolute;top:0;left:0;right:0;height:calc(var(--sat) + 56px);padding-top:var(--sat);display:flex;border-bottom:4px solid var(--w)}
#idx .ib .lab{flex:1;display:flex;align-items:center;padding-left:16px;font-family:var(--mono);font-weight:800;font-size:13px;letter-spacing:.06em;color:var(--y)}
#idx .ib .x{width:60px;background:var(--y);color:var(--k);font-family:var(--big);font-size:40px;display:grid;place-items:center}
#idx .it{flex:1;display:flex;align-items:flex-end;justify-content:space-between;padding:0 16px 6px;border-bottom:4px solid var(--w);font-family:var(--big);font-size:84px;line-height:.92;text-align:left;letter-spacing:-.005em;min-height:0}
#idx .it small{font-family:var(--mono);font-size:13px;font-weight:800;color:var(--y);align-self:flex-start;margin-top:12px}
#idx .it.cur{color:var(--y)}
#idx .it:active{background:var(--y);color:var(--k)}
#idx .it:active small{color:var(--k)}
#idx.on .it{animation:drop .24s steps(4) both}
#idx.on .it:nth-child(3){animation-delay:.04s}#idx.on .it:nth-child(4){animation-delay:.08s}#idx.on .it:nth-child(5){animation-delay:.12s}
@keyframes drop{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
#idx .foot{display:flex;justify-content:space-between;padding:12px 16px calc(var(--sab) + 12px);font-family:var(--mono);font-size:11px;font-weight:700;color:#9a9a9a}

/* loading */
#load{position:absolute;inset:0;z-index:300;background:var(--k);color:var(--w);display:none;flex-direction:column;justify-content:flex-end;padding:0 16px calc(var(--sab) + 30px)}
#load.on{display:flex}
#load .giant{font-size:220px;color:var(--y);line-height:.8}
#load .top{position:absolute;top:calc(var(--sat) + 16px);left:16px;right:16px;display:flex;justify-content:space-between;color:var(--y)}
#load .lines{font-family:var(--mono);font-size:12px;font-weight:700;line-height:1.9;margin:18px 0 14px;min-height:5.7em;color:#d8d8d8}
#load .pbar{height:24px;border:3px solid var(--w);position:relative}
#load .pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--y);width:0;animation:fill 1.15s steps(10) forwards}
@keyframes fill{to{width:100%}}

/* answer */
.ans-top{background:var(--k);color:var(--w);padding:14px 16px 18px;border-bottom:4px solid var(--k)}
.ans-top .lbl{color:var(--y)}
.ans-num{display:flex;align-items:flex-end;gap:10px;margin:22px 0 0}
.ans-num .giant{font-size:236px;color:var(--w);line-height:.8}
.ans-num .m{color:var(--y);padding-bottom:14px;font-size:12px;line-height:1.4}
.ans-top .lead{color:var(--w);font-size:28px}
.wtime{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:14px 16px;border-bottom:4px solid var(--k)}
.wtime .giant{font-size:76px}
.wtime .a{font-family:var(--big);font-size:46px;padding:0 6px 4px}
.wtime div:last-child{text-align:right}
.sideblk{padding:14px 16px}
.sideblk .giant{font-size:112px;display:block}
.sideblk .m{display:block;margin-top:6px}
.sideblk .tt{font-family:var(--mono);font-size:12px;color:var(--g);margin-top:2px}
.shout{font-family:var(--sans);font-weight:900;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:-.02em;padding:18px 16px;border-bottom:4px solid var(--k)}
.rng{position:relative;height:74px;margin:34px 0 6px}
.rng .ax{position:absolute;left:0;right:0;top:30px;height:4px;background:var(--k)}
.rng .tk{position:absolute;top:22px;width:2px;height:20px;background:var(--k)}
.rng .tk.s{top:26px;height:12px;width:1px}
.rng .tl{position:absolute;top:48px;font-family:var(--mono);font-size:10px;transform:translateX(-50%);font-weight:700}
.rng .band{position:absolute;top:14px;height:36px;background:repeating-linear-gradient(90deg,var(--k) 0 3px,var(--w) 3px 6px);border:3px solid var(--k)}
.rng .pin{position:absolute;top:0;height:64px;width:8px;background:var(--k);transform:translateX(-50%)}
.rng .pin b{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-family:var(--big);font-weight:400;font-size:20px;line-height:1}
.figs{display:grid;grid-template-columns:auto 1fr;gap:0 12px;margin:6px 0 0}
.figs b{font-family:var(--big);font-weight:400;font-size:34px;line-height:1.05;text-align:right;font-variant-numeric:tabular-nums}
.figs span{font-family:var(--mono);font-size:11.5px;font-weight:700;text-transform:uppercase;align-self:center;line-height:1.3}
.reg{padding:14px 16px;border-bottom:4px solid var(--k)}
.reg h4{margin:0 0 8px;font-family:var(--big);font-weight:400;font-size:34px;line-height:1;text-transform:uppercase}
.track{position:relative;height:40px;border:3px solid var(--k);margin:6px 0 4px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--k);width:0;transition:width .5s steps(6)}
.track .line{position:absolute;top:-14px;bottom:-14px;width:8px;background:var(--r);transform:translateX(-50%)}
.track .line:after{content:"LINE";position:absolute;top:-1px;left:12px;font-family:var(--mono);font-size:9px;font-weight:800;color:var(--r)}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--g);margin-bottom:8px}
.reg .figs b{font-size:26px}
.ticker{background:var(--r);color:var(--w);overflow:hidden;white-space:nowrap;border-bottom:4px solid var(--k);padding:10px 0}
.ticker div{display:inline-block;font-family:var(--mono);font-weight:800;font-size:13px;text-transform:uppercase;animation:mq 22s linear infinite;padding-left:16px}
@keyframes mq{to{transform:translateX(-50%)}}
.note{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:14px 16px;border-bottom:4px solid var(--k)}
.note .n{font-family:var(--big);font-size:30px;line-height:1}
.note p{margin:0;font-size:16.5px;line-height:1.38;font-weight:500}
.note.warn .n{color:var(--r)}
.mod{display:inline-flex;align-items:center;min-height:40px;margin-top:8px;padding:0 12px;background:var(--k);color:var(--w);font-family:var(--mono);font-weight:800;font-size:12px}
.mod:active{background:var(--y);color:var(--k)}
.logged{background:var(--k);color:var(--y);padding:18px 16px;border-bottom:4px solid var(--k);animation:cut .2s steps(2) both}
.logged b{font-family:var(--big);font-weight:400;font-size:60px;line-height:.9;display:block}
.logged.sq2 span{display:flex;gap:12px;align-items:flex-start;font-size:22px;font-weight:900;line-height:1.1;text-transform:uppercase;letter-spacing:-.01em}
.logged.sq2 span:before{content:"";flex:none;width:26px;height:26px;background:var(--y);margin-top:1px}
.logged span{font-weight:700;color:var(--w)}

/* learn */
.lrow{display:grid;grid-template-columns:86px 1fr;align-items:center;width:100%;border-bottom:4px solid var(--k);min-height:76px;text-align:left}
.lrow .n{font-family:var(--big);font-size:56px;line-height:1;padding:10px 0 8px 16px}
.lrow .t{font-weight:800;font-size:18px;line-height:1.15;padding:12px 16px 12px 0;letter-spacing:-.01em}
.lrow:active{background:var(--k);color:var(--w)}
.rd-head{background:var(--k);color:var(--w);padding:12px 16px 18px}
.rd-head .giant{font-size:170px;color:var(--y);line-height:.85}
.rd-head h1{font-family:var(--big);font-weight:400;font-size:42px;line-height:.95;text-transform:uppercase;margin:6px 0 0;letter-spacing:.005em}
.art{padding:16px 16px 0;font-size:17px;line-height:1.55}
.art .md-p{margin:0 0 1em}
.art .md-h3{font-family:var(--sans);font-weight:900;font-size:22px;line-height:1.1;text-transform:uppercase;letter-spacing:-.01em;margin:1.5em -16px .6em;padding:10px 16px 0;border-top:8px solid var(--k)}
.art .md-ul,.art .md-ol{padding-left:1.3em;margin:0 0 1em}
.art .md-ul{list-style:square}
.art li{margin:.35em 0}
.art .md-table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.35;margin:1em 0 1.4em}
.art .md-table th{font-family:var(--mono);font-size:10.5px;font-weight:800;text-transform:uppercase;text-align:left;padding:8px 8px 8px 0;border-top:4px solid var(--k);border-bottom:2px solid var(--k);vertical-align:bottom}
.art .md-table td{padding:8px 8px 8px 0;border-bottom:1px solid var(--k);vertical-align:top}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
.art .md-quote{margin:1.3em 0;padding:4px 0 4px 16px;border-left:10px solid var(--k);font-weight:800;font-size:20px;line-height:1.25}
.art .md-quote .md-p{margin:0}
.art .md-formula{margin:1.3em -16px;padding:18px 16px;background:var(--k);color:var(--w);font-family:var(--mono);font-size:15px}
.art .md-formula .md-p{margin:0}
.art .md-sources{margin:2em -16px 0;padding:14px 16px;border-top:8px solid var(--k);font-family:var(--mono);font-size:11.5px;line-height:1.5;counter-reset:s}
.art .md-sources-h{font-weight:800;text-transform:uppercase;margin-bottom:8px}
.art .md-sources ul{list-style:none;margin:0;padding:0}
.art .md-sources li{counter-increment:s;position:relative;padding-left:32px;margin-bottom:10px;overflow-wrap:anywhere}
.art .md-sources li:before{content:"[" counter(s) "]";font-weight:800;position:absolute;left:0;top:0}
.art a{color:inherit;text-decoration-thickness:2px}
.art code{font-family:var(--mono);font-size:.85em}
.md-verify{font-family:var(--mono);font-size:10px;color:var(--g)}
.art>.md-p:first-of-type{font-weight:800;font-size:21px;line-height:1.3;letter-spacing:-.01em}
.art>.md-h3:first-child{margin-top:0}

/* history / tables */
.hrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;padding:12px 16px;border-bottom:4px solid var(--k);text-align:left}
.hrow:active{background:var(--k);color:var(--w)}
.hrow .d{font-family:var(--mono);font-size:11px;font-weight:800;text-transform:uppercase}
.hrow .tm{font-family:var(--big);font-size:38px;line-height:1}
.hrow .sk{grid-column:1/-1;font-size:14px;font-weight:700}
.hrow .sk.r{color:var(--r)}
.hrow .ds{grid-column:1/-1;display:flex;gap:4px 14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px}
.hrow .ar{grid-row:1/3;grid-column:2;align-self:center;font-family:var(--big);font-size:34px}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:10px 0;border-bottom:2px solid var(--k);text-align:left;vertical-align:baseline}
.tbl th{font-family:var(--mono);font-size:10.5px;font-weight:800;text-transform:uppercase;border-bottom:4px solid var(--k)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--big);font-weight:400;font-size:26px}
.tbl th.n{font-family:var(--mono);font-size:10.5px;font-weight:800}
.tbl td.l{font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;padding-right:10px}
.hb{display:grid;grid-template-columns:96px 1fr 50px;align-items:center;gap:8px;margin:6px 0}
.hb .bb{height:22px;background:var(--k)}
.hb .bb.h{background:repeating-linear-gradient(90deg,var(--k) 0 4px,var(--w) 4px 7px);border:2px solid var(--k)}
.hb .bb.r{background:var(--r)}
.hb b{font-family:var(--big);font-weight:400;font-size:22px;text-align:right}
.empty{padding:40px 16px;border-bottom:4px solid var(--k);font-weight:900;font-size:24px;line-height:1.15;text-transform:uppercase}

/* settings */
.opt3{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:64px;padding:12px 16px;border-bottom:4px solid var(--k);font-family:var(--big);font-size:34px;line-height:1;text-transform:uppercase;text-align:left}
.opt3.on{background:var(--k);color:var(--y)}
.opt3 .m{font-size:11px}
.opt3:active{background:var(--y);color:var(--k)}
.opt3.lock{background:repeating-linear-gradient(135deg,var(--w) 0 8px,#e6e6e6 8px 10px);color:#9a9a9a}
.lockl{padding:10px 16px;border-bottom:4px solid var(--k);font-size:14px;font-weight:700;color:var(--r)}
.stepper{display:grid;grid-template-columns:76px 1fr 76px;border-bottom:4px solid var(--k)}
.stepper button{font-family:var(--sans);font-weight:900;font-size:54px;min-height:96px;text-align:center}
.stepper button:active{background:var(--k);color:var(--y)}
.stepper .giant{font-size:92px;text-align:center;border-left:4px solid var(--k);border-right:4px solid var(--k);display:grid;place-items:center}
.small{font-size:14px;line-height:1.4}
.disc{padding:16px;border-bottom:4px solid var(--k);font-size:15px;line-height:1.45;font-weight:500}

/* timer */
.tview{position:absolute;inset:0;z-index:200;display:none;flex-direction:column;background:var(--w);color:var(--k)}
.tview.on{display:flex}
.tview.inv{background:var(--k);color:var(--w)}
.tview .tb{height:calc(var(--sat) + 56px);padding-top:var(--sat);display:flex;border-bottom:4px solid currentColor;flex:none}
.tview .tb .lab{flex:1;display:flex;align-items:center;padding-left:16px;font-family:var(--mono);font-weight:800;font-size:13px;text-transform:uppercase}
.tview .tb button{min-width:64px;padding:0 12px;border-left:4px solid currentColor;font-family:var(--mono);font-weight:800;font-size:15px}
.tview .tb button[data-act=tclose],.grab .x,#idx .ib .x{font-family:var(--sans)!important;font-weight:900;font-size:34px!important}
.tview .tb .spd.on{background:var(--r);color:var(--w)}
.tbody{flex:1;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.side2{flex:1;display:flex;align-items:flex-end;justify-content:space-between;padding:16px;border-bottom:4px solid var(--k);font-family:var(--big);font-size:84px;line-height:.85;text-transform:uppercase;text-align:left;min-height:150px}
.side2 .m{align-self:flex-start;font-size:13px}
.side2.on{background:var(--y)}
.side2:active{background:var(--k);color:var(--w)}
.clockwrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 12px}
.clockwrap .now{font-family:var(--sans);font-weight:900;font-size:30px;text-transform:uppercase;letter-spacing:-.02em;line-height:1}
.clockwrap .giant{font-size:168px;line-height:.86;margin:10px 0 6px;white-space:nowrap}
.clockwrap .cap{font-family:var(--mono);font-weight:800;font-size:13px;text-transform:uppercase}
.tprog{height:28px;border:4px solid currentColor;position:relative;margin:22px 0 14px}
.tprog i{position:absolute;left:0;top:0;bottom:0;background:currentColor}
.tprog b{position:absolute;top:-14px;bottom:-14px;width:6px;background:var(--r);transform:translateX(-50%)}
.left2{display:flex;align-items:baseline;gap:12px}
.left2 .giant{font-size:58px;margin:0}
.tview .foot{flex:none;border-top:4px solid currentColor}
.tview .foot .slab{border:0}
.tview .foot p{margin:0;padding:10px 16px calc(var(--sab) + 12px);font-size:13px;font-weight:600}
.facedown{position:absolute;inset:0;z-index:260;background:var(--k);color:var(--y);display:flex;flex-direction:column;justify-content:center;padding:0 12px;animation:fd 1.6s steps(1) both;pointer-events:none}
.facedown .giant{font-size:176px;line-height:.92}
.facedown .m{color:var(--w);font-size:14px;margin-bottom:12px}
@keyframes fd{0%{background:var(--w);color:var(--k)}12%{background:var(--k);color:var(--y)}24%{background:var(--y);color:var(--k)}36%,100%{background:var(--k);color:var(--y)}}

/* questions */
.qhead{padding:14px 16px 16px;border-bottom:4px solid var(--k)}
.qhead .giant{font-size:74px}
.qhead .q{font-weight:900;font-size:28px;line-height:1.05;letter-spacing:-.02em;margin-top:10px}
.ans{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:68px;padding:14px 16px;border-bottom:4px solid var(--k);font-weight:800;font-size:20px;line-height:1.15;text-align:left}
.ans:after{content:"→";font-family:var(--big);font-size:28px}
.ans.multi:after{content:"";width:26px;height:26px;border:4px solid currentColor;flex:none}
.ans.multi.on:after{background:currentColor}
.ans.on{background:var(--k);color:var(--y)}
.ans:active{background:var(--k);color:var(--w)}
.ans.skin span small{display:block;font-weight:500;font-size:14px;margin-top:4px;line-height:1.35}
.tin{display:grid;grid-template-columns:1fr 60px 100px 60px;align-items:center;border-bottom:4px solid var(--k)}
.tin .l{padding:0 16px;font-weight:800;font-size:14px;text-transform:uppercase}
.tin button{font-family:var(--sans);font-weight:900;font-size:30px;min-height:60px;border-left:4px solid var(--k);text-align:center}
.tin button:active{background:var(--k);color:var(--y)}
.tin b{font-family:var(--big);font-weight:400;font-size:30px;text-align:center;border-left:4px solid var(--k);line-height:60px}

/* sheets */
.shbg{position:absolute;inset:0;z-index:600;background:rgba(0,0,0,.55)}

@keyframes shin{from{transform:translateY(100%)}}
.grab{flex:none;touch-action:none;cursor:grab;border-bottom:4px solid var(--k);display:flex;align-items:stretch}
.grab .gt{flex:1;padding:10px 16px 12px}
.grab .gt:before{content:"";display:block;width:56px;height:6px;background:var(--k);margin-bottom:10px}
.grab h3{margin:0;font-family:var(--big);font-weight:400;font-size:34px;line-height:.95;text-transform:uppercase}
.grab .x{width:60px;border-left:4px solid var(--k);font-family:var(--big);font-size:34px}
.grab .x:active{background:var(--k);color:var(--w)}
.shbody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(var(--sab) + 8px)}
.spfg{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:4px solid var(--k)}
.spfg button{min-height:72px;font-family:var(--big);font-size:30px;border-right:4px solid var(--k);border-bottom:4px solid var(--k);text-align:center}
.spfg button:nth-child(4n){border-right:0}
.spfg button:nth-child(n+5){border-bottom:0}
.spfg button.on{background:var(--k);color:var(--y)}
.search{display:block;width:100%;font-family:var(--big);font-size:40px;padding:12px 16px;border:0;border-bottom:4px solid var(--k);outline:none;border-radius:0;-webkit-appearance:none;background:var(--w);color:var(--k);text-transform:uppercase}
.search::placeholder{color:#b5b5b5}
.search:focus{background:var(--y)}

#toast.on{display:block}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .ticker div{white-space:normal;padding-right:16px}
  .ticker{white-space:normal}
}

<body>
<div id="app">
  <div class="bar" id="bar"><div class="lab" id="barlab"></div><button class="sq" data-act="index" aria-label="Index"><i></i></button></div>

  <div class="view" id="v-learn"></div>

  <div id="load"><div class="top m"><span>ICARUS / SOLVING</span><span>SAT 13 JUNE</span></div><div class="giant tab" id="loadnum">00</div><div class="lines" id="loadlines"></div><div class="pbar"><i></i></div></div>
  <div class="tview" id="timer"></div>
  <div id="idx">
    <div class="ib"><div class="lab">INDEX / ICARUS</div><button class="x" data-act="index" aria-label="Close">×</button></div>
    <button class="it" data-act="go" data-v="plan"><span>PLAN</span><small>01</small></button>
    <button class="it" data-act="go" data-v="learn"><span>LEARN</span><small>02</small></button>
    <button class="it" data-act="go" data-v="history"><span>HISTORY</span><small>03</small></button>
    <button class="it" data-act="go" data-v="settings"><span>SETTINGS</span><small>04</small></button>
    <div class="foot"><span>SAT 13 JUNE 11:42</span><span>PEAK UV 6.1 @ 13:20</span></div>
  </div>
  <div id="toast"></div>
</div>
<script src="shared/copy.js"></script>
<script src="shared/learn.js"></script>
<script src="shared/icarus.js"></script>
<script src="shared/switcher.js" defer></script>
<script>
(function () {
"use strict";
var I = window.ICARUS, t = I.t, esc = I.esc;
var app = document.getElementById("app");
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function pad(n) { return (n < 10 ? "0" : "") + n; }

function U(s) { return esc(String(s).toUpperCase()); }
var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
document.addEventListener("touchstart", function () {}, { passive: true });

var S = {
  from: I.slot.fromMin, until: I.slot.untilMin, posture: "lying", covered: false, stay: false,
  place: null, refreshed: false, logged: false, spf: null, setting: I.profile.setting, manual: 1.0,
  skinType: I.profile.skinType, history: I.history.slice(), skinDone: false, lcDone: false, notif: true

var REGION_KEY = { front: "regionFront", back: "regionBack", headAndShoulders: "regionHeadAndShoulders" };

/* ---------------- engine stand-in ---------------- */
function solve(stayOverride) {
  var stay = stayOverride == null ? S.stay : stayOverride;
  var win = hm(S.from) + "–" + hm(S.until), nowM = I.now.minutes, R = I.results;
  if (S.until <= nowM) return { kind: "passed", line: t("windowPassed"), window: win };
  if (S.from >= 17 * 60 || S.until <= 9 * 60 + 30) {
    var e = R.evening;
    return { kind: "weak", window: win, shortfall: e.shortfall, line: t("tooWeak", { shortfall: e.shortfall, nextDay: e.nextDay, nextHour: e.nextHour }), notices: [["uvaHeavy"]] };
  }
  if (stay) {
    var sw = R.stayWhole, app2 = t("applicationNormal");
    return { kind: "stay", window: win, spf: sw.spf, minutes: S.until - Math.max(S.from, nowM),
      line: t("planStayWearThis", { window: win, spf: sw.spf, application: app2 }),
      sunscreen: t("sunscreenPrescribed", { spf: sw.spf, application: app2, window: win }),
      reapply: t("reapply", { times: sw.reapply }), uva: sw.uvaMultiple,
      notices: [["uvaMultiple", { multiple: sw.uvaMultiple }], ["sunscreenApplicationBeatsLabel"], ["conservativeUntilCalibrated", { count: I.profile.reportsNeeded }]],
      alt: solve(false) };

  var base = lying ? (S.covered ? R.lyingCovered : R.lyingBest) : R.upBest;

    estimate: t("voEstimate", { assumptions: [t("assumptionMelanogenicFraction"), t(lying ? "assumptionShoulderFraction" : "assumptionFrontBackFraction")].join("; ") }),
    notices: [["boundByMelanogenic"], ["conservativeUntilCalibrated", { count: I.profile.reportsNeeded }]] };
  if (extra) res.notices.push(["coverToRunLonger", { minutes: extra }]);

  res.notices.push(["cloudCaveat"]);
  if (lying) {
    var bs = R.lyingBest.sides, up = Math.round(m * bs[0].minutes / (bs[0].minutes + bs[1].minutes));
    res.sides = [{ side: t("sideFaceUp"), minutes: up, from: hm(s), to: hm(s + up), lab: t("figSideMinutesFaceUp") },

  }

}
function modLinks(s) {
  var mods = [];
  var txt = esc(s).replace(/\s*\[Module (\d+)\]/g, function (m, n) { mods.push(+n); return ""; });
  return { text: txt, links: mods.map(function (n) { return '<button class="mod" data-act="module" data-n="' + n + '">→ MODULE ' + pad(n) + "</button>"; }).join(" ") };
}

/* ---------------- views + navigation ---------------- */
var cur = "plan", stack = [];
var LABELS = { plan: ["01", "PLAN"], learn: ["02", "LEARN"], history: ["03", "HISTORY"], settings: ["04", "SETTINGS"] };
function setBar(num, label, back) {
  $("#barlab").innerHTML = "<b>" + num + "</b><span>" + esc(label) + "</span>";
  var bb = $("#bar .back");
  if (back && !bb) $("#bar").insertAdjacentHTML("afterbegin", '<button class="back" data-act="back" aria-label="Back">←</button>');
  if (!back && bb) bb.remove();
}
function show(id) {
  $$(".view").forEach(function (v) { v.classList.remove("on", "cut"); });
  var v = $("#v-" + id); v.classList.add("on");
  if (!reduce) { void v.offsetWidth; v.classList.add("cut"); }
  return v;
}
function go(name) {
  stack = []; cur = name; closeIndex();
  var v = show(name); v.scrollTop = 0;
  setBar(LABELS[name][0], LABELS[name][1], false);
}
function sub(num, label, html, opts) {
  opts = opts || {};
  var v = $("#v-sub");
  if ($("#v-sub").classList.contains("on")) stack.push({ num: $("#barlab b").textContent, label: $("#barlab span").textContent, html: v.innerHTML, top: v.scrollTop, dark: v.classList.contains("dark") });
  v.innerHTML = html; v.classList.toggle("dark", !!opts.dark);
  show("sub"); v.scrollTop = 0; setBar(num, label, true);
}
function back() {
  var v = $("#v-sub");
  if (stack.length) {
    var p = stack.pop(); v.innerHTML = p.html; v.classList.toggle("dark", p.dark);
    show("sub"); v.scrollTop = p.top; setBar(p.num, p.label, true);
    if (v._rerender) v._rerender();
    return;
  }
  go(cur);
}
function openIndex() {
  $$("#idx .it").forEach(function (x) { x.classList.toggle("cur", x.dataset.v === cur); });
  $("#idx").classList.add("on");
}
function closeIndex() { $("#idx").classList.remove("on"); }

/* ---------------- plan ---------------- */
function renderPlan() {
  var d = S.until - S.from;
  var h = '<div class="blk tight"><div class="lbl"><span>' + U(t("calcSlotHeader")) + "</span><span>" + U(I.now.day) + " · " + I.now.time + "</span></div></div>";
  h += timeBlock("from", t("calcFrom")) + '<div class="dur"><span class="m">DURATION</span><b class="tab">' + Math.floor(d / 60) + "H " + pad(d % 60) + "M</b></div>" + timeBlock("until", t("calcUntil"));
  h += '<div class="blk tight"><div class="lbl"><span>' + U(t("calcPostureLabel")) + "</span><span></span></div></div>";
  h += two("posture", "lying", t("postureLyingTurning"), null, S.posture === "lying") + two("posture", "up", t("postureUpAndAbout"), null, S.posture === "up");
  h += two("toggle", "covered", t("calcCover"), t("calcCoverFootnote"), S.covered) + two("toggle", "stay", t("calcStay"), t("calcStayFootnote"), S.stay);
  h += '<button class="slab" data-act="plan"><span>' + U(t("calcCompute")) + '</span><span class="ar">→</span></button>';
  if (S.history.length && !S.skinDone) h += '<button class="row due" data-act="skin"><span>' + U(t("dueSkinCheck", { day: I.due[0].day })) + '</span><span class="v">→</span></button>';
  if (S.history.length && !S.lcDone) h += '<button class="row due" data-act="lc"><span>' + U(t("dueLastingColour", { day: I.due[1].day })) + '</span><span class="v">→</span></button>';
  h += '<div class="split"><button class="row" data-act="go" data-v="history"><span>' + U(t("calcHistory")) + '</span><span class="v">03</span></button><button class="row" data-act="go" data-v="settings"><span>' + U(t("calcSettings")) + '</span><span class="v">04</span></button></div>';
  h += ad();
  var v = $("#v-plan"), st = v.scrollTop; v.innerHTML = h; v.scrollTop = st;
  $$(".dig", v).forEach(dragDigits);
}
function ad() { return '<div class="ad"><span class="m">' + U(t("voAdvertisement")) + '</span><button data-act="adinfo" aria-label="' + esc(t("privacyOptions")) + '">i</button></div>'; }
function timeBlock(w, label) {
  return '<div class="time"><div class="dig" data-w="' + w + '"><div class="lbl"><span>' + U(label) + '</span></div><span class="giant tab">' + hm(S[w]) + '</span><span class="hint">DRAG ↕</span></div>' +
    '<div class="pm"><button data-act="step" data-w="' + w + '" data-d="15" aria-label="' + esc(label) + ' later">+</button><button data-act="step" data-w="' + w + '" data-d="-15" aria-label="' + esc(label) + ' earlier">−</button></div></div>';
}
function two(act, v, label, foot, on) {
  return '<button class="two' + (on ? " on" : "") + '" data-act="' + act + '" data-v="' + v + '" aria-pressed="' + !!on + '"><span class="t">' + esc(label) + "</span>" + (foot ? '<span class="f">' + esc(foot) + "</span>" : "") + '<span class="st">' + (on ? "ON" : "OFF") + "</span></button>";

function stepTime(w, d) {
  var v = Math.min(23 * 60, Math.max(5 * 60, S[w] + d));
  S[w] = v;
  if (w === "from" && S.until <= S.from) S.until = Math.min(S.from + 15, 23 * 60 + 15);
  if (w === "until" && S.until <= S.from) S.from = Math.max(S.until - 15, 4 * 60 + 45);
  $$(".dig").forEach(function (el) { $(".giant", el).textContent = hm(S[el.dataset.w]); });
  var dd = S.until - S.from, db = $(".dur b"); if (db) db.textContent = Math.floor(dd / 60) + "H " + pad(dd % 60) + "M";
}
function dragDigits(el) {
  var y0 = null, acc = 0;
  el.addEventListener("pointerdown", function (e) { y0 = e.clientY; acc = 0; el.classList.add("drag"); try { el.setPointerCapture(e.pointerId); } catch (x) {} });

    if (y0 == null) return;

  });

  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);

/* ---------------- loading ---------------- */
function loading(done) {
  var L = $("#load"), num = $("#loadnum"), lines = $("#loadlines");
  var place = S.place ? t("resultForecastFor", { place: S.place }) : t("resultForecastHere");
  var ls = ["> " + place.toUpperCase(), "> PEAK UV " + I.forecast.peakUVI + " @ " + I.forecast.peakTime, "> SLOT " + hm(S.from) + "–" + hm(S.until), "> SOLVING"];
  lines.innerHTML = ""; L.classList.remove("on"); void L.offsetWidth; L.classList.add("on");
  var bar = $(".pbar i", L); bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = "";
  var i = 0, iv = setInterval(function () { num.textContent = pad(Math.floor(Math.random() * 100)); }, 60);
  var lv = setInterval(function () { if (i < ls.length) lines.innerHTML += esc(ls[i++]) + "<br>"; }, 260);
  setTimeout(function () { clearInterval(iv); clearInterval(lv); done(); L.classList.remove("on"); }, 1200);
}

/* ---------------- answer ---------------- */
function openAnswer(replace) {
  loading(function () {
    if (replace) { var v = $("#v-sub"); v.innerHTML = answerHTML(solve()); v.scrollTop = 0; show("sub"); setBar("01", "YOUR ANSWER", true); }
    else sub("01", t("resultTitle").toUpperCase(), answerHTML(solve()));
    $("#v-sub")._rerender = null;
    rollUp();
  });
}
function rerenderAnswer() { var v = $("#v-sub"), st = v.scrollTop; v.innerHTML = answerHTML(solve()); v.scrollTop = st; }
function rollUp() {
  var el = $("#v-sub .ans-num .giant"); if (!el || reduce) return;
  var target = el.textContent, n = 0, len = target.length;
  var iv = setInterval(function () {
    n++;
    if (n > 12) { clearInterval(iv); el.textContent = target; return; }
    var s = "";
    for (var i = 0; i < len; i++) s += (n > 6 + i * 3) ? target[i] : (/\d/.test(target[i]) ? Math.floor(Math.random() * 10) : target[i]);
    el.textContent = s;
  }, 45);
}
function firstSentence(s) { var m = String(s).match(/^(.+?[.!?])(\s|$)/); return m ? m[1] : s; }
function restSentence(s) { return String(s).slice(firstSentence(s).length).trim(); }

  var place = S.place ? t("resultForecastFor", { place: S.place }) : t("resultForecastHere");
  var top = function (big, label) {
    return '<div class="ans-top"><div class="lbl"><span>' + U(t("resultTitle")) + "</span><span>" + U(R.window) + "</span></div>" +
      (big != null ? '<div class="ans-num"><span class="giant tab">' + big + '</span><span class="m">' + label + "</span></div>" : "") +
