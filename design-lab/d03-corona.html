<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corona</title>
<meta name="theme-color" content="#05060b">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@100;200;300;400;600&family=Unbounded:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060b; --sun:#ff7a1a; --gold:#ffd27a; --violet:#3b2a6b; --red:#ff3d3d; --ink:#f3ecdf;
  --dim:rgba(243,236,223,.62); --faint:rgba(243,236,223,.38); --line:rgba(255,210,122,.16);
  --up:#ffd27a; --down:#ff7a1a; --hs:#b79bff;
  --st:max(env(safe-area-inset-top),22px); --sb:max(env(safe-area-inset-bottom),14px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:Sora,system-ui,-apple-system,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--gold)}
#app{position:relative;width:100%;height:100dvh;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 60% at 85% 8%,rgba(59,42,107,.55),transparent 60%),radial-gradient(90% 50% at 0% 70%,rgba(59,42,107,.35),transparent 65%),radial-gradient(70% 40% at 60% 100%,rgba(120,40,10,.22),transparent 70%),var(--bg)}
@media (min-width:600px){
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 60% at 50% 40%,#140f24,#020203)}
  #app{width:390px;height:844px;border-radius:54px;box-shadow:0 0 0 10px #0d0d12,0 0 0 11px #2a2833,0 40px 140px rgba(255,122,26,.18)}
  :root{--st:54px;--sb:30px}
}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stars{z-index:0;transition:opacity 1.4s ease}
#stars.dim{opacity:.22}
.tw{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,240,210,.8);animation:tw 4s ease-in-out infinite;z-index:0;pointer-events:none;transition:opacity 1.4s}
#twinkles.dim .tw{opacity:.15!important;animation:none}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
#scene{z-index:1;pointer-events:none}
#flash{position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0;background:radial-gradient(60% 45% at 50% 38%,rgba(255,250,230,.95),rgba(255,122,26,.65) 40%,rgba(255,61,61,.15) 75%,transparent)}
#flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}

/* screens */
.screen{position:absolute;inset:0;z-index:5;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--st) + 6px) 20px calc(var(--sb) + 104px);opacity:0;visibility:hidden;pointer-events:none;transform-origin:50% 32%;
  transition:opacity .55s var(--ease),transform .7s var(--ease),filter .55s var(--ease),visibility 0s linear .7s}
.screen.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .55s var(--ease),transform .7s var(--ease),filter .55s var(--ease),visibility 0s}
.screen::-webkit-scrollbar{display:none}
.noanim .screen{transition:opacity .2s linear,visibility 0s!important;transform:none!important;filter:none!important}

.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:6px}
.brand{font-family:Unbounded;font-weight:400;font-size:11px;letter-spacing:.42em;color:var(--gold);padding-left:2px}
.clock{font-size:12px;color:var(--dim);letter-spacing:.08em}
.clock b{font-weight:600;color:var(--ink)}
.lab{font-family:Unbounded;font-weight:400;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,210,122,.72)}
.h1{font-family:Unbounded;font-weight:300;font-size:22px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 4px;line-height:1.25}
.sub{color:var(--dim);font-size:13px;line-height:1.5}
.back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--gold);transition:transform .2s,background .2s}
.back:active{transform:scale(.9);background:rgba(255,210,122,.12)}
.back svg{width:18px;height:18px}
.tcenter{position:absolute;left:0;right:0;text-align:center;pointer-events:none}

.glass{position:relative;background:linear-gradient(180deg,rgba(42,30,78,.46),rgba(10,9,20,.72));border:1px solid rgba(255,210,122,.13);border-radius:24px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 40px rgba(59,42,107,.25),0 14px 40px rgba(0,0,0,.45)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.07),transparent 30%)}

/* plan */
.signals{display:flex;flex-direction:column;gap:8px;margin:2px 0 6px}
.signal{display:flex;align-items:center;gap:12px;min-height:46px;padding:8px 14px 8px 10px;border-radius:23px;border:1px solid rgba(255,210,122,.22);background:rgba(255,122,26,.06);text-align:left;font-size:14px;transition:transform .2s,background .2s}
.signal:active{transform:scale(.98);background:rgba(255,122,26,.16)}
.signal i{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,122,26,.5),transparent 70%)}
.signal i::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px 2px var(--sun);animation:beat 2.2s ease-in-out infinite}
.signal span{flex:1}
.signal em{font-style:normal;color:var(--gold);font-size:18px}
@keyframes beat{50%{transform:scale(1.6);opacity:.6}}
.dialwrap{position:relative;width:340px;height:340px;margin:0 auto;max-width:100%}
.dial{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;border-radius:50%}
.dialinfo{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);text-align:center;pointer-events:none;width:180px}
.dialinfo b{display:block;font-weight:200;font-size:15px;letter-spacing:.18em}
.dialinfo small{font-size:10px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
.ro{display:flex;align-items:center;justify-content:space-between;padding:6px 4px;border-radius:20px;border:1px solid var(--line);background:rgba(10,8,20,.5)}
.ro.act{border-color:rgba(255,210,122,.6);box-shadow:0 0 22px rgba(255,122,26,.25)}
.ro div{text-align:center;flex:1}
.ro small{display:block;font-family:Unbounded;font-size:9px;letter-spacing:.3em;color:rgba(255,210,122,.7);text-transform:uppercase}
.ro b{display:block;font-weight:200;font-size:30px;letter-spacing:.06em;font-variant-numeric:tabular-nums;line-height:1.15}
.nud{width:34px;height:44px;border-radius:14px;color:var(--gold);font-size:18px;display:grid;place-items:center}
.nud:active{background:rgba(255,210,122,.14)}
.sats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.sat{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 2px 6px;text-align:center;border-radius:18px;transition:transform .25s var(--ease)}
.sat:active{transform:scale(.94)}
.orb{position:relative;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,210,122,.25);background:radial-gradient(circle at 50% 35%,rgba(59,42,107,.6),rgba(5,6,11,.9));transition:box-shadow .4s,border-color .4s,background .4s}
.orb::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(255,210,122,.18);animation:spin 40s linear infinite}
.orb::before{content:"";position:absolute;top:-10px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--faint);transform-origin:3px 43px;animation:spin 14s linear infinite;transition:background .4s,box-shadow .4s}
.sat.on .orb{border-color:rgba(255,210,122,.75);box-shadow:0 0 28px rgba(255,122,26,.45),inset 0 0 18px rgba(255,122,26,.35);background:radial-gradient(circle at 50% 35%,rgba(255,122,26,.45),rgba(30,10,4,.9))}
.sat.on .orb::before{background:var(--gold);box-shadow:0 0 8px 2px var(--sun)}
.orb svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sat .nm{font-size:11.5px;line-height:1.3;color:var(--dim);min-height:30px}
.sat .st{font-family:Unbounded;font-size:8.5px;letter-spacing:.28em;color:var(--faint);text-transform:uppercase}
.sat.on .st{color:var(--gold)}
@keyframes spin{to{transform:rotate(360deg)}}
.feet{padding:12px 16px;font-size:12px;line-height:1.5;color:var(--dim);margin-bottom:16px}
.feet p{margin:4px 0;display:flex;gap:10px}
.feet p b{flex:0 0 auto;font-family:Unbounded;font-weight:400;font-size:8.5px;letter-spacing:.2em;color:var(--gold);padding-top:3px;width:46px}
.cta{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:60px;border-radius:30px;font-family:Unbounded;font-size:12.5px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:#fff6e6;
  background:radial-gradient(120% 220% at 50% 130%,#ff9a3c,#c64600 45%,#2b0e02 85%);box-shadow:0 0 34px rgba(255,122,26,.42),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -12px 24px rgba(0,0,0,.35);transition:transform .2s,box-shadow .3s;overflow:hidden}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.cta:active{transform:scale(.97);box-shadow:0 0 60px rgba(255,122,26,.7)}
.ghost{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:26px;border:1px solid rgba(255,210,122,.32);color:var(--gold);font-size:14.5px;font-weight:400;transition:transform .2s,background .2s;padding:8px 18px;text-align:center}
.ghost:active{transform:scale(.97);background:rgba(255,210,122,.1)}
.ghost svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ad{margin:22px auto 0;max-width:330px;height:54px;border-radius:14px;border:1px dashed rgba(243,236,223,.18);display:flex;align-items:center;justify-content:center;gap:10px;color:var(--faint);font-size:11px;letter-spacing:.2em;text-transform:uppercase;background:repeating-linear-gradient(135deg,rgba(255,255,255,.015) 0 8px,transparent 8px 16px)}
.ad i{font-style:normal;font-size:9px;border:1px solid var(--faint);border-radius:4px;padding:1px 4px;letter-spacing:.1em}

/* answer */
.ahead{display:flex;align-items:center;gap:12px;position:relative}
.ahead .lab{flex:1;text-align:center;padding-right:44px}
.adial{position:relative;width:260px;height:260px;margin:-4px auto 0;pointer-events:none}
.big{text-align:center;margin-top:-6px}
.big .n{font-weight:100;font-size:118px;line-height:.95;letter-spacing:.1em;padding-left:.1em;color:#fff3dc;text-shadow:0 0 28px rgba(255,170,80,.55),0 0 80px rgba(255,122,26,.35);font-variant-numeric:tabular-nums}
.big .n.mid{font-size:74px;letter-spacing:.08em;padding-top:16px}
.big .u{font-family:Unbounded;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-top:8px}
.big .w{margin-top:10px;font-weight:200;font-size:17px;letter-spacing:.24em;color:var(--dim)}
.lead{font-size:17px;line-height:1.55;font-weight:300;text-align:center;margin:18px 6px 18px;color:#f6efe3}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.half{padding:14px 14px 12px;border-radius:20px;border:1px solid rgba(255,210,122,.16);background:rgba(10,8,20,.55);position:relative;overflow:hidden}
.half::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c);box-shadow:0 0 18px 2px var(--c)}
.half b{display:block;font-weight:200;font-size:44px;line-height:1;letter-spacing:.04em;color:var(--c)}
.half span{display:block;font-size:12.5px;color:var(--dim);margin-top:6px}
.half small{display:block;font-size:12px;color:var(--faint);margin-top:4px;letter-spacing:.06em}
.range{display:flex;align-items:center;gap:14px;padding:12px 16px;margin-bottom:12px}
.range .rr{display:flex;gap:10px;align-items:baseline;flex:0 0 auto}
.range .rr b{font-weight:200;font-size:22px;color:var(--dim)}
.range p{margin:0;font-size:11.5px;line-height:1.45;color:var(--faint)}
.instr{padding:18px 16px 16px;margin-bottom:12px}
.instr .lab{display:block;margin-bottom:12px}
.ringsrow{display:flex;gap:14px;align-items:center}
.ringsrow svg{flex:0 0 150px;height:150px;overflow:visible}
.ringsrow svg circle{fill:none}
.rf{transition:stroke-dashoffset 1.6s var(--ease)}
.regtabs{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.regtab{display:flex;align-items:center;gap:8px;min-height:40px;padding:6px 10px;border-radius:14px;text-align:left;font-size:13px;color:var(--dim);border:1px solid transparent;transition:background .2s,border-color .2s}
.regtab i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:0 0 auto}
.regtab b{margin-left:auto;font-weight:300;color:var(--ink);font-variant-numeric:tabular-nums}
.regtab.sel{border-color:rgba(255,210,122,.3);background:rgba(255,210,122,.07);color:var(--ink)}
.figs{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.fig{display:flex;align-items:baseline;gap:12px;padding:6px 0}
.fig b{flex:0 0 58px;font-weight:200;font-size:26px;text-align:right;font-variant-numeric:tabular-nums}
.fig span{font-size:13px;color:var(--dim);line-height:1.4}
.fig.hot b{color:#ff8a6a}
.legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--faint);margin-top:10px}
.legend i{width:18px;height:0;border-top:2px dashed var(--red);filter:drop-shadow(0 0 4px var(--red))}
.notice{display:flex;gap:12px;padding:14px 16px;margin-bottom:10px;border-radius:20px;background:rgba(59,42,107,.22);border:1px solid rgba(183,155,255,.16);font-size:14px;line-height:1.5}
.notice .gl{flex:0 0 22px;height:22px;margin-top:1px;border-radius:50%;border:1px solid rgba(255,210,122,.45);display:grid;place-items:center}
.notice .gl::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--sun)}
.notice.warn{background:rgba(255,61,61,.08);border-color:rgba(255,61,61,.3)}
.notice.warn .gl{border-color:var(--red)}
.notice.warn .gl::after{background:var(--red);box-shadow:0 0 8px var(--red)}
.notice p{margin:0}
.learn-link{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 12px 6px 10px;min-height:32px;border-radius:16px;border:1px solid rgba(255,210,122,.35);color:var(--gold);text-decoration:none;font-size:12.5px;line-height:1.3}
.learn-link::before{content:"";width:12px;height:12px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--gold);box-shadow:inset 0 0 0 2.5px rgba(5,6,11,1),inset 0 0 0 5px var(--gold)}
.learn-link:active{background:rgba(255,210,122,.12)}
.links{display:flex;flex-wrap:wrap;gap:6px}
.secl{margin:22px 4px 10px}
.place{padding:14px 16px;margin:10px 0 12px}
.place .pl{display:flex;align-items:center;gap:10px;font-size:14px}
.place .pl svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.6}
.place .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.place .acts button{min-height:44px;border-radius:14px;border:1px solid var(--line);color:var(--gold);font-size:13px}
.place .acts button:active{background:rgba(255,210,122,.1)}
.place small{display:block;color:var(--faint);font-size:12px;margin-top:8px}
.estim{font-size:11.5px;line-height:1.5;color:var(--faint);margin:10px 6px 16px;text-align:center}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.logged{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:22px;border:1px solid rgba(255,210,122,.4);background:rgba(255,210,122,.08);font-size:14px;line-height:1.45;animation:pop .6s var(--ease)}
.logged svg{flex:0 0 26px;height:26px;stroke:var(--gold);fill:none;stroke-width:2}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.altline{margin-top:10px;padding:12px 14px;border-radius:16px;background:rgba(255,210,122,.08);border:1px solid rgba(255,210,122,.3);font-size:14px;line-height:1.5;animation:pop .6s var(--ease)}
.stagger>*{animation:rise .8s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98);filter:blur(4px)}}

/* loading */
#s-loading{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(var(--sb) + 150px)}
#s-loading .lab{animation:breathe 1.6s ease-in-out infinite}
.ldial{position:absolute;left:50%;top:44%;width:300px;height:300px;margin:-150px 0 0 -150px;pointer-events:none}
@keyframes breathe{50%{opacity:.35}}

/* timer */
.tdial{position:relative;width:330px;height:330px;margin:0 auto;max-width:100%}
.tcount{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.tcount b{font-weight:100;font-size:54px;letter-spacing:.08em;font-variant-numeric:tabular-nums;color:#fff4e0;text-shadow:0 0 18px rgba(255,170,80,.5)}
.tcount span{font-size:11px;color:var(--dim);letter-spacing:.06em;margin-top:2px;max-width:120px;line-height:1.35}
.tnow{text-align:center;margin:6px 0 2px;font-family:Unbounded;font-weight:300;font-size:19px;letter-spacing:.14em;text-transform:uppercase}
.tnow em{font-style:normal;color:var(--c,var(--gold));text-shadow:0 0 18px var(--c,var(--sun))}
.tsmall{text-align:center;color:var(--dim);font-size:14px;margin-bottom:18px}
.tsmall b{font-weight:300;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.sidepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 18px}
.sidepick button{min-height:76px;border-radius:22px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;transition:all .3s}
.sidepick button i{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.sidepick button.sel{border-color:var(--c);background:rgba(255,210,122,.08);box-shadow:0 0 26px rgba(255,122,26,.25)}
.chip60{position:absolute;right:0;top:0;min-width:56px;height:36px;border-radius:18px;border:1px solid var(--line);font-size:12px;color:var(--faint);letter-spacing:.08em;padding:0 12px}
.chip60.on{color:#05060b;background:var(--gold);border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,122,.6)}
.foot{font-size:12px;color:var(--faint);text-align:center;margin:10px 10px 0;line-height:1.5}
.turnmsg{position:absolute;left:20px;right:20px;top:42%;text-align:center;z-index:41;font-family:Unbounded;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#fff;text-shadow:0 0 24px var(--sun);opacity:0;pointer-events:none;transition:opacity .4s}
.turnmsg.on{opacity:1}

/* learn */
.const{display:block;width:100%;height:150px;margin:6px 0 4px;overflow:visible}
.const line{stroke:rgba(255,210,122,.25);stroke-width:.8}
.const circle.s{fill:#fff3dc;filter:drop-shadow(0 0 3px #ffb35c)}
.const text{fill:rgba(255,210,122,.75);font-family:Unbounded;font-size:7px;letter-spacing:.1em}
.const g{cursor:pointer}
.const .hit{fill:transparent}
.olist{position:relative;margin:8px 0 0;padding:0}
.olist::before{content:"";position:absolute;left:27px;top:24px;bottom:24px;width:1px;background:linear-gradient(var(--gold),rgba(59,42,107,.8),transparent);opacity:.4}
.mod{position:relative;display:flex;align-items:center;gap:16px;width:100%;min-height:64px;padding:8px 6px;text-align:left;border-radius:18px;transition:background .2s,transform .2s}
.mod:active{background:rgba(255,210,122,.08);transform:translateX(4px)}
.mod .pn{flex:0 0 44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:200;font-size:15px;letter-spacing:.08em;border:1px solid rgba(255,210,122,.3);background:radial-gradient(circle at 35% 30%,rgba(255,122,26,.35),#07070e 70%);position:relative;z-index:1}
.mod:nth-child(3n+2) .pn{background:radial-gradient(circle at 35% 30%,rgba(183,155,255,.4),#07070e 70%)}
.mod:nth-child(3n) .pn{background:radial-gradient(circle at 35% 30%,rgba(255,210,122,.4),#07070e 70%)}
.mod .tt{flex:1;font-size:15px;line-height:1.35;font-weight:300}
.mod .ar{color:var(--faint)}
.reader{max-width:560px;margin:0 auto}
.reader .num{font-weight:100;font-size:88px;line-height:1;letter-spacing:.06em;color:rgba(255,210,122,.85);text-shadow:0 0 30px rgba(255,122,26,.35);margin-top:6px}
.reader h1{font-family:Unbounded;font-weight:300;font-size:21px;line-height:1.4;letter-spacing:.04em;margin:10px 0 18px}
.prose{font-size:17px;line-height:1.68;color:#e6dfd2;font-weight:300}
.prose .md-p{margin:0 0 1.05em}
.prose strong{color:#ffe2a8;font-weight:600}
.prose em{color:#f3ecdf}
.prose .md-h3{font-family:Unbounded;font-weight:400;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:1.8em 0 .8em;line-height:1.5}
.prose ul,.prose ol{padding-left:1.2em;margin:0 0 1.1em}
.prose li{margin:.35em 0}
.prose ul li::marker{color:var(--sun)}
.prose code{font-family:ui-monospace,Menlo,monospace;font-size:.85em;background:rgba(255,210,122,.1);padding:1px 5px;border-radius:5px}
.tablewrap{overflow-x:auto;margin:0 -4px 1.2em;-webkit-overflow-scrolling:touch}
.md-table{border-collapse:collapse;font-size:13.5px;line-height:1.45;min-width:100%}
.md-table th{font-family:Unbounded;font-weight:400;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);text-align:left;padding:8px;border-bottom:1px solid rgba(255,210,122,.35)}
.md-table td{padding:8px;border-bottom:1px solid rgba(255,255,255,.07);vertical-align:top}
.md-formula{margin:1.2em 0;padding:18px;border-radius:18px;border:1px solid rgba(255,210,122,.4);text-align:center;background:radial-gradient(circle at 50% 0%,rgba(255,122,26,.18),transparent 70%);box-shadow:0 0 30px rgba(255,122,26,.15)}
.md-formula .md-p{margin:0;font-size:18px}
.md-quote{margin:1em 0;padding:4px 0 4px 16px;border-left:2px solid var(--hs);color:#d9d0ff}
.md-sources{margin-top:2em;padding:16px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);font-size:13px;line-height:1.55;color:var(--dim)}
.md-sources-h{font-family:Unbounded;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.md-sources ul{padding-left:1.1em;margin:0}
.md-sources li{margin:.5em 0}
.md-url{color:#c9b8ff}
.md-verify{font-size:10px;letter-spacing:.08em;color:#ff9c7a;border:1px solid rgba(255,156,122,.5);border-radius:4px;padding:0 4px}

/* history / settings */
.chart{padding:16px 14px 12px;margin:12px 0}
.chart svg{width:100%;height:170px;display:block;overflow:visible}
.chart p{margin:8px 2px 0;font-size:12px;color:var(--dim);line-height:1.45}
.legendrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin:8px 2px 0}
.legendrow span{display:flex;align-items:center;gap:6px}
.legendrow i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.unrep{display:flex;align-items:center;gap:10px;font-size:13px;color:#ffb39a;margin:8px 4px 14px}
.unrep::before{content:"";width:6px;height:6px;border-radius:50%;background:#ff8a6a;box-shadow:0 0 8px #ff8a6a}
.sess{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;transition:transform .2s}
.sess:active{transform:scale(.985)}
.sess .d{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sess .d b{font-weight:400;font-size:15px}
.sess .d span{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.sess .m{font-size:12px;color:var(--faint);margin-top:3px}
.sess .sed{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.sess .sed div{border-left:2px solid var(--c);padding-left:8px}
.sess .sed b{display:block;font-weight:200;font-size:21px}
.sess .sed small{display:block;font-size:10.5px;line-height:1.3;color:var(--faint)}
.sess .sk{margin-top:10px;font-size:12.5px;color:var(--dim)}
.sess .sk.none{color:#ffb39a}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.empty{text-align:center;padding:40px 20px;color:var(--dim);font-size:15px;line-height:1.55}
.empty .ring0{width:90px;height:90px;margin:0 auto 18px;border-radius:50%;border:1px dashed rgba(255,210,122,.35);box-shadow:inset 0 0 30px rgba(59,42,107,.6)}
.kv{padding:6px 16px;margin-bottom:12px}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.kv div:last-child{border-bottom:0}
.kv span{color:var(--dim)}
.kv b{font-weight:400;text-align:right}
.setsec{padding:6px 16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);width:100%;text-align:left;font-size:15px}
.row:last-child{border-bottom:0}
.row .v{margin-left:auto;color:var(--gold);font-size:14px}
button.row:active{opacity:.6}
.row.dang{color:#ff8a6a}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:20px;background:rgba(0,0,0,.35);border:1px solid var(--line);margin:12px 0 8px}
.seg button{min-height:44px;border-radius:16px;font-size:12.5px;color:var(--dim);transition:all .3s var(--ease);display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.sel{background:linear-gradient(180deg,rgba(255,122,26,.5),rgba(120,40,0,.5));color:#fff;box-shadow:0 0 18px rgba(255,122,26,.35)}
.seg button.lock{opacity:.55}
.seg svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}
.note{font-size:12.5px;line-height:1.5;color:var(--dim);margin:6px 0 10px}
.note.hot{color:#ffb39a}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);color:var(--gold);font-size:20px}
.stepper button:active{background:rgba(255,210,122,.12)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 6px}
.totals div{border-left:2px solid var(--c);padding-left:8px}
.totals b{display:block;font-weight:200;font-size:24px}
.totals small{font-size:11px;color:var(--faint)}
.disc{font-size:12.5px;line-height:1.6;color:var(--dim);margin:8px 0}

/* sheet + modal + flow */
.sheetwrap{position:absolute;inset:0;z-index:60;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(2,2,6,.6);opacity:0;transition:opacity .35s}
.sheetwrap.open{pointer-events:auto}
.sheetwrap.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;border-radius:30px 30px 0 0;
  background:linear-gradient(180deg,rgba(32,22,58,.96),rgba(8,7,16,.98));border-top:1px solid rgba(255,210,122,.3);box-shadow:0 -20px 60px rgba(0,0,0,.6),0 -1px 30px rgba(255,122,26,.12);
  transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.9,.25,1)}
.sheetwrap.open .sheet{transform:none}
.shead{flex:0 0 auto;padding:10px 20px 6px;touch-action:none;cursor:grab}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,210,122,.4);margin:0 auto 14px}
.shead .h1{font-size:15px;margin:0}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 20px calc(var(--sb) + 18px)}
.spfs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 18px}
.spfs button{min-height:54px;border-radius:16px;border:1px solid var(--line);font-weight:200;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.spfs button small{font-family:Unbounded;font-size:7.5px;letter-spacing:.2em;color:var(--faint);margin-bottom:3px}
.spfs button.sel{border-color:var(--gold);background:rgba(255,210,122,.12);box-shadow:0 0 18px rgba(255,210,122,.25);color:#fff}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;border-radius:18px;border:1px solid var(--line);margin-bottom:8px;text-align:left;font-size:14.5px;line-height:1.4;transition:all .25s}
.opt::before{content:"";flex:0 0 16px;height:16px;border-radius:50%;border:1.5px solid rgba(255,210,122,.5);transition:all .25s}
.opt.sel{border-color:rgba(255,210,122,.7);background:rgba(255,122,26,.1)}
.opt.sel::before{background:var(--gold);box-shadow:0 0 0 3px rgba(5,6,11,1) inset,0 0 10px var(--sun)}
.opt.multi::before{border-radius:5px}
.opt:active{transform:scale(.985)}
.search{width:100%;height:50px;border-radius:25px;border:1px solid rgba(255,210,122,.35);background:rgba(0,0,0,.35);color:var(--ink);font:inherit;font-size:16px;padding:0 20px;outline:none}
.search:focus{border-color:var(--gold);box-shadow:0 0 18px rgba(255,122,26,.3)}
.results{margin-top:12px}
.modal{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(2,2,6,.7);opacity:0;pointer-events:none;transition:opacity .3s}
.modal.open{opacity:1;pointer-events:auto}
.modal .box{max-width:340px;padding:22px 20px 18px;background:linear-gradient(180deg,#221a3c,#0b0a16);transform:scale(.9);transition:transform .4s var(--ease)}
.modal.open .box{transform:none}
.modal p{font-size:14.5px;line-height:1.55;margin:0 0 16px}
.modal .two{margin-top:0}
.btn-danger{min-height:50px;border-radius:25px;background:linear-gradient(180deg,#ff5a3d,#9d1b0c);color:#fff;font-size:14px;box-shadow:0 0 22px rgba(255,61,61,.35);padding:6px 10px}
.flow{z-index:50}
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.fhead .lab{flex:1;text-align:center}
.prog{display:flex;justify-content:center;gap:7px;margin:0 0 24px}
.prog i{width:6px;height:6px;border-radius:50%;background:rgba(255,210,122,.2);transition:all .4s}
.prog i.d{background:var(--gold)}
.prog i.c{background:var(--sun);box-shadow:0 0 10px var(--sun);transform:scale(1.5)}
.q{font-family:Unbounded;font-weight:300;font-size:21px;line-height:1.42;letter-spacing:.02em;margin:0 0 22px}
.qa{display:flex;flex-direction:column;gap:10px}
.ans{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:12px 18px;border-radius:29px;border:1px solid rgba(255,210,122,.28);text-align:left;font-size:15.5px;line-height:1.35;background:rgba(10,8,20,.55);transition:all .25s}
.ans:active,.ans.sel{border-color:var(--gold);background:rgba(255,122,26,.16);box-shadow:0 0 22px rgba(255,122,26,.25)}
.ans .sw{flex:0 0 18px;height:18px;border-radius:50%;background:var(--c,transparent);border:1px solid rgba(255,255,255,.2)}
.timesgrid{display:flex;flex-direction:column;gap:12px}
.tg{padding:14px 16px}
.tg .lab{display:block;margin-bottom:8px}
.tg div{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tg label{font-size:12px;color:var(--dim)}
.tg input{display:block;width:100%;margin-top:4px;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font:inherit;font-size:18px;font-weight:200;padding:0 10px;color-scheme:dark}
.fin{text-align:center;padding-top:30px}
.fin .burst{width:120px;height:120px;margin:0 auto 26px;border-radius:50%;background:radial-gradient(circle,#fff6dc 0 18%,#ffb04a 30%,rgba(255,122,26,.4) 50%,transparent 70%);animation:burst 2.8s ease-in-out infinite}
@keyframes burst{50%{transform:scale(1.12);filter:brightness(1.2)}}
.fin p{font-size:16px;line-height:1.6;margin:0 0 14px}
.skt{display:flex;flex-direction:column;gap:8px}
.skt .ans{align-items:flex-start;flex-direction:column;gap:4px;border-radius:22px}
.skt .ans b{font-family:Unbounded;font-weight:400;font-size:12px;letter-spacing:.2em}
.skt .ans span{font-size:13px;color:var(--dim);line-height:1.45}
.check{display:flex;align-items:center;gap:14px;min-height:56px;padding:10px 16px;border-radius:20px;border:1px solid var(--line);width:100%;text-align:left;font-size:15px}
.check i{flex:0 0 24px;height:24px;border-radius:7px;border:1.5px solid rgba(255,210,122,.6);display:grid;place-items:center}
.check.on i{background:var(--gold);box-shadow:0 0 12px var(--sun)}
.check.on i::after{content:"";width:10px;height:5px;border-left:2px solid #05060b;border-bottom:2px solid #05060b;transform:rotate(-45deg) translate(1px,-1px)}
.perm{padding:16px;margin-bottom:12px}
.perm p{font-size:13.5px;line-height:1.55;color:var(--dim);margin:0 0 12px}
.perm .ghost.on{background:rgba(255,210,122,.14);color:#fff}
.fnext{margin-top:22px}
.cta[disabled]{opacity:.35;filter:grayscale(.6)}

/* orbit menu */
#orbitBtn{position:absolute;left:50%;bottom:calc(var(--sb) + 14px);width:62px;height:62px;margin-left:-31px;z-index:30;border-radius:50%;transition:transform .5s var(--ease),opacity .4s}
#orbitBtn.hide{opacity:0;transform:translateY(40px) scale(.6);pointer-events:none}
#orbitBtn .r1{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,210,122,.45);background:radial-gradient(circle,rgba(20,14,36,.9) 50%,rgba(59,42,107,.6));box-shadow:0 0 26px rgba(255,122,26,.25),0 6px 20px rgba(0,0,0,.5)}
#orbitBtn .r2{position:absolute;inset:-6px;border-radius:50%;border:1px dashed rgba(255,210,122,.25);animation:spin 24s linear infinite}
#orbitBtn .core{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:radial-gradient(circle,#fff6dc,#ffb04a 50%,#ff7a1a);box-shadow:0 0 16px 4px rgba(255,122,26,.7);transition:transform .45s var(--ease)}
#orbitBtn .moon{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--gold);transform:rotate(0) translateX(21px);animation:orbit 6s linear infinite}
@keyframes orbit{to{transform:rotate(360deg) translateX(21px)}}
.menuopen #orbitBtn .core{transform:scale(.55)}
#orbitBtn:active .r1{transform:scale(.92)}
.orbit{position:absolute;inset:0;z-index:29;pointer-events:none}
#dock{position:absolute;left:0;right:0;bottom:0;height:calc(var(--sb) + 96px);z-index:28;pointer-events:none;background:linear-gradient(rgba(5,6,11,0),rgba(5,6,11,.82) 55%,rgba(5,6,11,.95));transition:opacity .4s}
#dock.hide{opacity:0}
.orbit .bg{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 100%,rgba(30,18,50,.94),rgba(5,6,11,.9));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .4s}
.orbit svg.ring{position:absolute;left:50%;bottom:calc(var(--sb) + 45px);width:320px;height:320px;margin-left:-160px;transform:translateY(50%) scale(.3) rotate(-60deg);opacity:0;transition:transform .7s var(--ease),opacity .5s;overflow:visible}
.orbit .oi{position:absolute;left:50%;bottom:calc(var(--sb) + 45px);width:76px;height:76px;margin:0 0 -38px -38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;
  transform:rotate(calc(var(--a) - 70deg)) translateX(0) rotate(calc(70deg - var(--a))) scale(.3);transition:transform .7s var(--ease),opacity .4s;transition-delay:calc(var(--i) * 45ms)}
.orbit .oi .p{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,210,122,.4);background:radial-gradient(circle at 40% 30%,rgba(59,42,107,.9),#07070e);box-shadow:0 0 18px rgba(59,42,107,.8)}
.orbit .oi.cur .p{border-color:var(--gold);background:radial-gradient(circle at 40% 30%,rgba(255,122,26,.6),#1a0a02);box-shadow:0 0 26px rgba(255,122,26,.55)}
.orbit .oi svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.orbit .oi span{font-family:Unbounded;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.orbit .oi:active .p{transform:scale(.9)}
.menuopen .orbit{pointer-events:auto}
.menuopen .orbit .bg{opacity:1}
.menuopen .orbit svg.ring{transform:translateY(50%) scale(1) rotate(0);opacity:1}
.menuopen .orbit .oi{opacity:1;transform:rotate(var(--a)) translateX(142px) rotate(calc(-1 * var(--a))) scale(1)}
.toast{position:absolute;left:50%;bottom:calc(var(--sb) + 92px);z-index:80;transform:translate(-50%,20px);opacity:0;max-width:330px;width:max-content;padding:12px 18px;border-radius:20px;background:rgba(24,18,40,.95);border:1px solid rgba(255,210,122,.35);font-size:13.5px;line-height:1.45;text-align:center;pointer-events:none;transition:all .4s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hint{text-align:center;font-size:11px;letter-spacing:.12em;color:var(--faint);margin:-2px 0 10px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .screen{transition:opacity .25s linear,visibility 0s!important;transform:none!important;filter:none!important}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="stars"></canvas>
  <div id="twinkles"></div>
  <canvas id="scene"></canvas>
  <div id="flash"></div>
  <div class="turnmsg" id="turnmsg"></div>

  <!-- PLAN -->
  <section class="screen on" id="s-plan" data-nav="plan">
    <div class="top"><div class="brand">ICARUS</div><div class="clock" id="clock"></div></div>
    <div class="signals" id="signals"></div>
    <div class="lab" id="slotCap" style="text-align:center;margin:10px 0 4px"></div>
    <div class="dialwrap"><div class="dial" id="planDial" role="slider" aria-label="Slot on the day's orbit"></div>
      <div class="dialinfo"><b id="durT"></b><small id="durS"></small></div></div>
    <div class="readout">
      <div class="ro" id="roFrom"><button class="nud" data-nud="from,-5" aria-label="Earlier">&#8249;</button><div><small id="lFrom"></small><b id="fromT"></b></div><button class="nud" data-nud="from,5" aria-label="Later">&#8250;</button></div>
      <div class="ro" id="roUntil"><button class="nud" data-nud="until,-5" aria-label="Earlier">&#8249;</button><div><small id="lUntil"></small><b id="untilT"></b></div><button class="nud" data-nud="until,5" aria-label="Later">&#8250;</button></div>
    </div>
    <div class="hint">Drag the two handles along the orbit · tap the sun for the menu</div>
    <div class="sats">
      <button class="sat on" id="satPosture"><div class="orb" id="postureGlyph"></div><div class="nm" id="postureName"></div><div class="st" id="postureSt"></div></button>
      <button class="sat" id="satCover"><div class="orb"><svg viewBox="0 0 32 32"><path d="M5 21.5h22"/><path d="M9.5 21.5c0-7 2.8-10.5 6.5-10.5s6.5 3.5 6.5 10.5"/><path d="M11 17.5h10"/></svg></div><div class="nm" id="coverName"></div><div class="st">off</div></button>
      <button class="sat" id="satStay"><div class="orb"><svg viewBox="0 0 32 32"><path d="M10 6h12M10 26h12"/><path d="M11.5 6c0 5.5 9 7 9 10s-9 4.5-9 10M20.5 6c0 5.5-9 7-9 10s9 4.5 9 10"/><path d="M14 23h4"/></svg></div><div class="nm" id="stayName"></div><div class="st">off</div></button>
    </div>
    <div class="glass feet"><p><b>Cover</b><span id="coverFoot"></span></p><p><b>Stay</b><span id="stayFoot"></span></p></div>
    <button class="cta" id="planBtn"><span id="planBtnT"></span></button>
    <div class="ad" role="img" aria-label="Advertisement"><i>AD</i><span id="adT1"></span></div>
  </section>

  <!-- LOADING -->
  <section class="screen" id="s-loading"><div class="ldial" id="loadDial"></div><div class="lab" id="loadLab"></div></section>

  <!-- ANSWER -->
  <section class="screen" id="s-answer">
    <div class="ahead"><button class="back" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg></button><div class="lab" id="ansTitle"></div></div>
    <div class="adial" id="ansDial"></div>
    <div id="ansBody"></div>
  </section>

    var os = $("#obStart"); os && os.addEventListener("click", function(){ hap("heavy"); if (ob.type) S.skinType = ob.type; S.notif = ob.notif || S.notif; I.store.set("corona-onboarded", 1); Nav.go("s-plan", { root: true, dir: -1 }); });
  }
  return { skin: skin, lasting: lasting, onboarding: onboarding };
})();

/* ---------------- boot ---------------- */
if (RM) app.classList.add("noanim");
drawStars();
Scene.resize();
buildOrbit();
Plan.init();
Nav.sceneFor("s-plan");
if (location.hash === "#onboarding") Flow.onboarding();
window.CORONA = { S: S, Nav: Nav, Flow: Flow, Timer: Timer, Answer: Answer, Learn: Learn, openSection: openSection };
})();
</script>
