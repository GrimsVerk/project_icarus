<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Silhouette</title>
<meta name="theme-color" content="#efe2d3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#efe2d3; --sand2:#f7ede2; --sand3:#e6d3bf; --clay:#c9714f; --clay-d:#a5533a; --umber:#3b2620; --peach:#e9b48a;
  --mute:#8b6d5f; --soft:#b99a87; --line:#b23a2a; --card:#fbf4ec;
  --disp:"Fraunces",Georgia,serif; --ui:"Manrope",-apple-system,system-ui,sans-serif;
  --flow:cubic-bezier(.22,1,.36,1); --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--sand)}
body{font-family:var(--ui);color:var(--umber);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(120% 70% at 50% 18%,#f9efe4 0,#efe2d3 55%,#e8d6c3 100%)}
@media (min-width:600px){
  body{display:grid;place-items:center;background:#d9c6b2}
  #app{position:relative;width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 10px #2b1d18,0 40px 90px rgba(59,38,32,.45);--st:54px;--sb:24px}
}
/* ---------- screens ---------- */
#stack{position:absolute;inset:0}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(var(--st) + 8px) 20px calc(var(--sb) + 96px)}
.scr.in{animation:fadeIn .5s var(--flow) both}
.scr.out{animation:fadeOut .32s ease both;pointer-events:none}
.scr.inUp{animation:inUp .55s var(--flow) both}
@keyframes fadeIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeOut{to{opacity:0}}
@keyframes inUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:6px}
.topbar .date{flex:1;font:600 12px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ico{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--umber);transition:background .2s,transform .2s var(--flow)}
.ico:active{background:rgba(59,38,32,.08);transform:scale(.92)}
.ico svg{width:22px;height:22px}
.back{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.45);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 4px 14px rgba(59,38,32,.08)}
.back:active{transform:scale(.94)}
h1.disp{font:400 34px/1.04 var(--disp);font-variation-settings:"opsz" 120,"SOFT" 100;letter-spacing:-.02em;margin:4px 0 6px}
h1.disp em{font-style:italic;color:var(--clay-d)}
.kick{font:700 11px/1.2 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.lead{font:400 21px/1.32 var(--disp);font-variation-settings:"opsz" 40;letter-spacing:-.01em;margin:10px 0;text-wrap:pretty}
.body{font:500 15px/1.5 var(--ui);margin:8px 0}
.small{font:500 12.5px/1.45 var(--ui);color:var(--mute)}
/* ---------- due ---------- */
.due{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 14px;min-height:48px;border-radius:18px;margin-top:8px;
  background:rgba(251,244,236,.75);box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 6px 18px rgba(59,38,32,.06);transition:transform .25s var(--flow)}
.due:active{transform:scale(.98)}
.due .dot{width:10px;height:10px;border-radius:50%;background:var(--clay);box-shadow:0 0 0 4px rgba(201,113,79,.18);flex:none;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 7px rgba(201,113,79,.06)}}
.due span{flex:1;font:600 14.5px/1.3 var(--ui)}
.due small{display:block;font:500 12px/1.3 var(--ui);color:var(--mute);margin-top:1px}
.due i{font-style:normal;color:var(--clay-d);font-weight:700}
/* ---------- posture pills ---------- */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:24px;background:rgba(59,38,32,.07);margin-top:6px}
.seg button{position:relative;z-index:1;min-height:44px;border-radius:20px;font:600 13.5px/1.2 var(--ui);color:var(--mute);transition:color .3s;padding:0 8px}
.seg button.on{color:var(--umber)}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:20px;background:var(--card);box-shadow:0 4px 14px rgba(59,38,32,.12);transition:transform .5s var(--flow)}
.seg.r .knob{transform:translateX(100%)}
.seg.three{grid-template-columns:1fr 1fr 1fr}.seg.three .knob{width:calc(33.33% - 2.7px)}
.seg.three.p1 .knob{transform:translateX(100%)}.seg.three.p2 .knob{transform:translateX(200%)}
/* ---------- stage & figure ---------- */
.stage{position:relative;height:372px;margin:6px -20px 0;transition:height .8s var(--flow)}
.stage.lie{height:232px}
.stage .sunarc{position:absolute;left:24px;right:24px;top:6px;height:150px;pointer-events:none}
.stage .sun{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  background:radial-gradient(circle,#fff6e6 0,#f6c99b 35%,rgba(233,180,138,.5) 60%,rgba(233,180,138,0) 72%);transition:left .5s var(--flow),top .5s var(--flow);pointer-events:none}
.stage .sun::after{content:"";position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,rgba(246,201,155,.35),rgba(246,201,155,0) 65%)}
.stage .floor{position:absolute;left:50%;bottom:14px;width:190px;height:22px;margin-left:-95px;border-radius:50%;background:radial-gradient(closest-side,rgba(59,38,32,.18),rgba(59,38,32,0));transition:all .8s var(--flow)}
.stage.lie .floor{width:340px;margin-left:-170px;bottom:46px;height:30px;opacity:.5}
.stage .towel{position:absolute;left:50%;top:50%;width:330px;height:150px;margin:-62px 0 0 -165px;border-radius:14px;opacity:0;transform:scale(.9);transition:all .7s var(--flow);
  background:linear-gradient(90deg,transparent 0 12px,rgba(201,113,79,.18) 12px 20px,transparent 20px calc(100% - 20px),rgba(201,113,79,.18) calc(100% - 20px) calc(100% - 12px),transparent 0),rgba(251,244,236,.55);box-shadow:0 10px 30px rgba(59,38,32,.08),inset 0 0 0 1px rgba(59,38,32,.05)}
.stage.lie .towel{opacity:1;transform:none}
.figwrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.fig{position:relative;perspective:900px}
.fig .rot{transition:transform .9s var(--flow);transform-origin:50% 50%}
.fig.lie .rot{transform:rotate(-90deg)}
.fig .card{position:relative;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform 1.1s var(--flow)}
.fig.flipped .card{transform:rotateY(180deg)}
.fig .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fig .face.b{transform:rotateY(180deg)}
.fig svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 12px rgba(59,38,32,.16))}
.fig .reg{cursor:pointer}
.fig .cover-g{opacity:0;transition:opacity .5s var(--flow)}
.fig.covered .cover-g{opacity:1}
.fig .hat{transition:transform .7s var(--flow),opacity .5s;transform:translateY(-26px);opacity:0}
.fig.covered .hat{transform:none;opacity:1}
.fig .lineG{opacity:0;transition:opacity .6s .4s}
.fig.showline .lineG{opacity:1}
.fig .lbl{opacity:0;transition:opacity .6s .6s}
.fig.showlbl .lbl{opacity:1}
.fig.breathe .rot{animation:fbreath 1.6s ease-in-out infinite}
@keyframes fbreath{50%{filter:brightness(1.06)}}
.fig.lie.breathe .rot{animation:none}
.flipbtn{position:absolute;left:20px;bottom:10px;text-transform:capitalize;display:flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:20px;background:rgba(251,244,236,.85);
  font:700 12px/1 var(--ui);box-shadow:0 4px 14px rgba(59,38,32,.1);transition:transform .25s var(--flow)}
.flipbtn:active{transform:scale(.95)}
.flipbtn svg{width:16px;height:16px}
.sidetag{position:absolute;left:18px;bottom:16px;font:italic 400 15px/1 var(--disp);color:var(--mute)}
/* ---------- ribbon ---------- */
.ribbon{position:relative;height:96px;margin:4px 0 0;touch-action:none}
.ribbon .track{position:absolute;left:0;right:0;top:44px;height:22px;border-radius:11px;overflow:hidden;
  background:linear-gradient(90deg,#efe2d3 0%,#efd9c3 12%,#ebc3a0 28%,#e09a72 42%,#d07c58 50%,#e09a72 58%,#ebc3a0 72%,#efd9c3 86%,#efe2d3 100%);opacity:.5;
  box-shadow:inset 0 1px 3px rgba(59,38,32,.15)}
.ribbon .sel{position:absolute;top:36px;height:38px;border-radius:3px;
  background:linear-gradient(90deg,#e7a47e,#c9714f);box-shadow:0 6px 18px rgba(201,113,79,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.ribbon .h{position:absolute;top:30px;width:40px;height:50px;display:flex;align-items:center;touch-action:none;cursor:grab}
.ribbon .h[data-k=from]{margin-left:-40px;justify-content:flex-end}
.ribbon .h[data-k=until]{justify-content:flex-start}
.ribbon .h::before{content:"";width:14px;height:38px;background:var(--umber);box-shadow:0 3px 10px rgba(59,38,32,.3);transition:transform .3s var(--flow)}
.ribbon .h[data-k=from]::before{border-radius:10px 3px 3px 10px}
.ribbon .h[data-k=until]::before{border-radius:3px 10px 10px 3px}
.ribbon .h::after{content:"";position:absolute;top:21px;width:2px;height:10px;border-radius:1px;background:rgba(251,244,236,.7)}
.ribbon .h[data-k=from]::after{right:6px}.ribbon .h[data-k=until]::after{left:6px}
.ribbon .h.act::before{transform:scaleY(1.12)}
.ribbon .sel{cursor:grab;touch-action:none}
.ribbon .tl{position:absolute;top:0;transform:translateX(-50%);text-align:center;white-space:nowrap;pointer-events:none}
.ribbon .tl small{display:block;font:700 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ribbon .tl b{display:block;font:500 21px/1.1 var(--disp);font-variant-numeric:lining-nums tabular-nums;margin-top:2px}
.ribbon .ticks{position:absolute;left:0;right:0;top:76px;height:16px;font:600 10px/1 var(--ui);color:var(--soft)}
.ribbon .ticks span{position:absolute;transform:translateX(-50%)}
.ribbon .now{position:absolute;top:38px;width:2px;height:34px;margin-left:-1px;background:var(--umber);opacity:.35;border-radius:1px}
/* ---------- toggles ---------- */
.tog{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;margin-top:10px;
  background:rgba(251,244,236,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.8);transition:transform .25s var(--flow)}
.tog:active{transform:scale(.985)}
.tog .tx{flex:1;min-width:0}
.tog b{display:block;font:700 15px/1.3 var(--ui)}
.tog small{display:block;font:500 12.5px/1.45 var(--ui);color:var(--mute);margin-top:4px}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:rgba(59,38,32,.16);flex:none;transition:background .35s var(--flow);margin-top:2px}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(59,38,32,.25);transition:transform .45s var(--flow)}
.sw.on{background:var(--clay)}.sw.on::after{transform:translateX(20px)}
/* ---------- CTA + nav ---------- */
.ctaWrap{position:sticky;bottom:calc(var(--sb) + 70px);z-index:4;margin-top:18px;padding-top:6px;pointer-events:none}
.cta{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:29px;
  background:linear-gradient(180deg,#d27b58,#b95f3f);color:#fff7ef;font:700 16px/1 var(--ui);letter-spacing:.01em;
  box-shadow:0 14px 30px rgba(169,83,58,.35),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .3s var(--flow),box-shadow .3s}
.cta:active{transform:scale(.97);box-shadow:0 6px 16px rgba(169,83,58,.35)}
.cta.dark{background:linear-gradient(180deg,#4a3129,#33211b);box-shadow:0 12px 26px rgba(59,38,32,.3)}
.cta.ghost{background:rgba(251,244,236,.85);color:var(--umber);box-shadow:0 6px 18px rgba(59,38,32,.08)}
.cta svg{width:20px;height:20px}
#nav{position:absolute;left:50%;bottom:calc(var(--sb) + 12px);z-index:20;transform:translateX(-50%);display:flex;padding:4px;border-radius:26px;
  background:rgba(59,38,32,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(59,38,32,.3);transition:transform .5s var(--flow),opacity .3s}
#nav.hide{transform:translate(-50%,120px);opacity:0}
#nav button{position:relative;z-index:1;min-width:86px;min-height:44px;border-radius:22px;font:700 13.5px/1 var(--ui);color:rgba(251,244,236,.6);transition:color .3s}
#nav button.on{color:var(--umber)}
#nav .pk{position:absolute;top:4px;bottom:4px;left:4px;width:86px;border-radius:22px;background:var(--sand2);transition:transform .5s var(--flow)}
#nav.learn .pk{transform:translateX(86px)}
#nav .more{min-width:44px;color:rgba(251,244,236,.75)}
#menu{position:absolute;left:50%;bottom:calc(var(--sb) + 70px);z-index:21;transform:translate(-50%,16px) scale(.96);opacity:0;pointer-events:none;
  background:var(--card);border-radius:20px;padding:6px;box-shadow:0 18px 40px rgba(59,38,32,.25);transition:all .35s var(--flow);min-width:200px}
#menu.open{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px;border-radius:14px;font:600 15px/1 var(--ui)}
#menu button:active{background:rgba(59,38,32,.06)}
#menu svg{width:20px;height:20px}
/* ---------- ad ---------- */
.ad{margin:22px 0 4px;border-radius:14px;padding:8px 10px 10px;background:rgba(59,38,32,.045)}
.ad small{display:block;font:700 9.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.ad div{height:50px;border-radius:8px;border:1px dashed rgba(59,38,32,.2);display:grid;place-items:center;font:500 11px/1 var(--ui);color:var(--soft)}
/* ---------- answer ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center;margin-top:4px;min-height:400px}
.hero .figcol{position:relative;width:190px;height:400px}
.hero.lie{grid-template-columns:1fr;min-height:0}
.hero.lie .figcol{width:auto;height:240px}
.total{padding-left:4px}
.total .n{font:300 112px/.86 var(--disp);font-variation-settings:"opsz" 144,"SOFT" 100;letter-spacing:-.05em;color:var(--umber)}
.total .u{font:600 13px/1.3 var(--ui);color:var(--mute);margin-top:6px}
.total .w{font:italic 400 18px/1.2 var(--disp);color:var(--clay-d);margin-top:10px}
.hero.lie .total{display:flex;align-items:flex-end;gap:14px;padding:0}
.sidechips{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{display:flex;align-items:baseline;gap:6px;min-height:40px;padding:9px 14px;border-radius:20px;background:rgba(251,244,236,.7);font:600 13px/1.2 var(--ui);color:var(--mute);transition:all .4s var(--flow)}
.chip b{font:400 20px/1 var(--disp);color:var(--umber)}
.chip.on{background:var(--umber);color:rgba(251,244,236,.75)}.chip.on b{color:var(--sand2)}
.hsun{position:absolute;top:-6px;left:0;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#fff6e6 0,#f6c99b 40%,rgba(233,180,138,0) 72%);animation:sweep 1.25s var(--flow) both;pointer-events:none}
@keyframes sweep{from{transform:translate(-30px,60px);opacity:0}30%{opacity:1}to{transform:translate(300px,10px);opacity:0}}
.loadline{font:italic 400 17px/1.3 var(--disp);color:var(--mute);margin-top:8px;animation:pulseT 1.2s ease-in-out infinite}
@keyframes pulseT{50%{opacity:.4}}
.range{position:relative;margin:18px 0 6px;padding:18px 16px 14px;border-radius:20px;background:rgba(251,244,236,.7)}
.range .bar{position:relative;height:10px;border-radius:5px;margin:30px 10px 10px;background:linear-gradient(90deg,rgba(201,113,79,.12),rgba(201,113,79,.5),rgba(201,113,79,.12))}
.range .pin{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--umber);box-shadow:0 0 0 5px rgba(251,244,236,1),0 4px 12px rgba(59,38,32,.3)}
.range .pinl{position:absolute;bottom:22px;transform:translateX(-50%);font:500 22px/1 var(--disp);white-space:nowrap}
.range .ends{display:flex;justify-content:space-between;gap:16px;font:500 12px/1.35 var(--ui);color:var(--mute)}
.range .ends b{display:block;font:400 22px/1 var(--disp);color:var(--umber);margin-bottom:3px}
.range .ends div:last-child{text-align:right}
.regions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.rcard{position:relative;overflow:hidden;text-align:left;padding:12px 10px 10px;border-radius:18px;background:rgba(251,244,236,.75);min-height:104px;transition:transform .25s var(--flow)}
.rcard:active{transform:scale(.96)}
.rcard .lvl{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(233,180,138,.75),rgba(201,113,79,.7));transition:height 1.2s var(--flow)}
.rcard .ln{position:absolute;left:0;right:0;border-top:1.5px dashed var(--line)}
.rcard .t{position:relative;font:700 11px/1.2 var(--ui);letter-spacing:.06em;text-transform:uppercase}
.rcard .v{position:relative;font:400 26px/1 var(--disp);margin-top:8px}
.rcard .v small{font:600 11px/1 var(--ui);color:var(--mute)}
.notice{margin-top:10px;padding:16px;border-radius:20px;background:rgba(251,244,236,.75)}
.notice p{margin:0;font:500 14.5px/1.5 var(--ui)}
.mlink{display:inline-flex;align-items:center;gap:8px;margin-top:10px;min-height:40px;padding:0 14px;border-radius:20px;background:rgba(201,113,79,.12);color:var(--clay-d);font:700 12.5px/1.2 var(--ui);text-align:left}
.mlink:active{background:rgba(201,113,79,.22)}
.placecard{margin-top:18px;padding:14px 16px;border-radius:20px;background:rgba(59,38,32,.05)}
.placecard b{display:block;font:700 14px/1.3 var(--ui)}
.placecard small{display:block;font:500 12px/1.4 var(--ui);color:var(--mute);margin-top:2px}
.placecard .row{display:flex;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:22px;background:rgba(251,244,236,.85);font:700 13px/1.2 var(--ui);box-shadow:0 4px 12px rgba(59,38,32,.06);transition:transform .25s var(--flow)}
.pill:active{transform:scale(.96)}
.pill.clay{background:var(--clay);color:#fff7ef}
.textlink{display:inline-block;min-height:44px;padding:12px 2px;font:700 14px/1.2 var(--ui);color:var(--clay-d);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.logged{display:flex;gap:10px;align-items:center;margin-top:12px;padding:14px 16px;border-radius:18px;background:var(--umber);color:var(--sand2);font:600 14px/1.4 var(--ui)}
.logged::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--peach);flex:none}
.altline{margin-top:10px;padding:14px 16px;border-radius:18px;background:rgba(201,113,79,.12);font:500 14.5px/1.5 var(--ui)}
.est{font:italic 400 13.5px/1.5 var(--disp);color:var(--mute);margin:14px 2px}
.reveal>*{animation:inUp .7s var(--flow) both}
/* ---------- sheet ---------- */
#sheet{position:absolute;inset:0;z-index:40;pointer-events:none}
#sheet .scrim{position:absolute;inset:0;background:rgba(59,38,32,.32);opacity:0;transition:opacity .35s}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;border-radius:30px 30px 0 0;background:var(--sand2);
  transform:translateY(105%);transition:transform .55s var(--flow);box-shadow:0 -12px 40px rgba(59,38,32,.2)}
#sheet.open{pointer-events:auto}#sheet.open .scrim{opacity:1}#sheet.open .pane{transform:none}
#sheet .grab{padding:10px 0 4px;display:grid;place-items:center;touch-action:none;cursor:grab}
#sheet .grab i{width:40px;height:5px;border-radius:3px;background:rgba(59,38,32,.2)}

.opt:active{transform:scale(.985)}
.spfs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.tbig{font:300 96px/.9 var(--disp);font-variation-settings:"opsz" 144;letter-spacing:-.04em;text-align:center;font-variant-numeric:tabular-nums lining-nums;margin-top:6px}

.speed.on{background:var(--umber);color:var(--sand2)}

.wherehint{text-align:center;font:italic 400 15px/1.3 var(--disp);color:var(--mute)}
.chk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:52px;padding:12px 16px;border-radius:16px;margin-top:8px;background:rgba(255,255,255,.5);font:600 14.5px/1.35 var(--ui);transition:all .3s var(--flow)}

.lcard.feat{background:linear-gradient(160deg,#fbf4ec,#f3dcc8)}

.article .no{font:italic 300 52px/1 var(--disp);color:var(--clay)}

.article .md-p{font:400 17px/1.62 var(--disp);font-variation-settings:"opsz" 14;margin:0 0 15px}
.article .md-h3{font:700 15px/1.35 var(--ui);margin:26px 0 8px;color:var(--clay-d)}
.article ul,.article ol{font:400 16.5px/1.6 var(--disp);padding-left:22px;margin:0 0 16px}
.article li{margin:5px 0}
.article .md-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;border-collapse:collapse;margin:8px 0 18px;font:500 13px/1.4 var(--ui);max-width:100%}

.article .md-formula{margin:10px 0 18px;padding:16px 18px;border-radius:18px;background:rgba(201,113,79,.12);font:500 17px/1.4 var(--disp)}
.article .md-formula .md-p{margin:0}
.article .md-quote{margin:10px 0 18px;padding-left:16px;border-left:3px solid var(--peach)}
.article code{font:600 .88em var(--ui);background:rgba(59,38,32,.07);padding:1px 5px;border-radius:5px}
.article .md-verify{font:700 9px/1 var(--ui);color:var(--soft)}
.article .md-sources{margin-top:28px;padding:16px;border-radius:20px;background:rgba(59,38,32,.05);font:500 12.5px/1.5 var(--ui)}
.article .md-sources-h{font:700 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.article .md-sources ul{font:500 12.5px/1.5 var(--ui);padding-left:16px}
.article a{color:var(--clay-d)}
.nextmod{display:block;width:100%;text-align:left;margin-top:20px;padding:18px;border-radius:22px;background:var(--umber);color:var(--sand2)}
.nextmod small{display:block;font:700 10.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.nextmod span{display:block;font:400 20px/1.2 var(--disp);margin-top:6px}
/* ---------- settings ---------- */
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:54px;padding:12px 16px;border-radius:18px;background:rgba(251,244,236,.75);margin-top:8px;font:600 15px/1.3 var(--ui)}
.srow .tx{flex:1}.srow i{font-style:normal;color:var(--mute)}
.srow:active{transform:scale(.99)}
.lockrow{display:flex;gap:8px;align-items:center}
table.tot{width:100%;border-collapse:collapse;margin-top:6px;font:500 14px/1.3 var(--ui)}
table.tot th{font:700 10.5px/1.3 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);text-align:right;padding:8px 0 8px 8px;vertical-align:bottom}
table.tot th:first-child,table.tot td:first-child{text-align:left;padding-left:0}
table.tot td{padding:10px 0 10px 8px;text-align:right;border-top:1px solid rgba(59,38,32,.09)}
table.tot td b{font:400 19px/1 var(--disp)}
.danger{color:var(--line)}
/* ---------- onboarding ---------- */
.onb{position:absolute;inset:0;z-index:50;background:radial-gradient(120% 70% at 50% 18%,#f9efe4 0,#efe2d3 55%,#e8d6c3 100%);display:flex;flex-direction:column}
.onb .scr{position:relative;flex:1;padding-bottom:24px}
.skipintro{position:absolute;right:16px;top:calc(var(--st) + 2px);z-index:2;min-height:44px;padding:0 14px;border-radius:22px;font:700 12.5px/1 var(--ui);color:var(--mute)}
.onb .foot{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;padding:10px 20px calc(var(--sb) + 14px)}
.onb.enter{animation:fadeIn .6s var(--flow) both}
.typecard{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border-radius:20px;margin-top:8px;background:rgba(251,244,236,.7);transition:all .35s var(--flow)}
.typecard .rn{font:italic 400 28px/1 var(--disp);color:var(--clay);min-width:44px}
.typecard p{margin:0;font:500 13px/1.45 var(--ui);color:var(--mute)}
.typecard b{display:block;font:700 14.5px/1.3 var(--ui);margin-bottom:3px}
.typecard.on{background:var(--card);box-shadow:0 0 0 2px var(--clay)}
.toast{position:absolute;left:20px;right:20px;bottom:calc(var(--sb) + 76px);z-index:45;padding:14px 18px;border-radius:20px;background:var(--umber);color:var(--sand2);font:600 14px/1.4 var(--ui);
  transform:translateY(16px);opacity:0;transition:all .4s var(--flow);pointer-events:none;box-shadow:0 14px 30px rgba(59,38,32,.3)}
.toast.show{transform:none;opacity:1}
@media (prefers-reduced-motion:reduce){
  .scr.in,.scr.inUp,.reveal>*,.onb.enter{animation:none}
  .fig .card,.fig .rot,.stage{transition-duration:.01s}
  .due .dot,.tnow::before,.loadline{animation:none}
}

<script>
(function(){
"use strict";
var I = window.ICARUS, T = I.t, E = I.esc;
/* ======================= CORE (scenario logic) ======================= */
var NOW = I.now.minutes;
function pad(n){return (n<10?"0":"")+n;}
function hm(m){m=Math.round(m);return pad(Math.floor(m/60))+":"+pad(m%60);}
function parseHM(s){var p=String(s).split(":");return (+p[0])*60+(+p[1]);}
function r1(x){return Math.round(x*10)/10;}
function f1(x){return (Math.round(x*10)/10).toFixed(1);}
var PS=[0];(function(){for(var m=0;m<1440;m++)PS.push(PS[m]+I.uvAt(m+.5));})();
function uvInt(a,b){a=Math.max(0,Math.round(a));b=Math.min(1440,Math.round(b));return b>a?PS[b]-PS[a]:0;}
var R0=I.results;
var UP_COVERED={minutes:50,start:"12:55",end:"13:45",range:{lower:43,upper:58,clipped:false},
  regions:[{key:"front",plan:1.35,left:2.4,cycle:9.8},{key:"back",plan:1.35,left:2.4,cycle:8.6},{key:"headAndShoulders",plan:0.0,left:2.4,cycle:11.4}]};
function regionName(k){return T(k==="front"?"regionFront":k==="back"?"regionBack":"regionHeadAndShoulders");}
function solve(st){
  var f=st.from,u=st.until,lying=st.posture==="lying";
  var base=lying?(st.covered?R0.lyingCovered:R0.lyingBest):(st.covered?UP_COVERED:R0.upBest);
  var r={lying:lying,covered:st.covered,stay:st.stay,from:f,until:u,window:hm(f)+"–"+hm(u),notices:[],estimate:[]};
  if(u<=NOW+5){r.kind="passed";r.headline=T("windowPassed");return r;}
  var fe=Math.max(f,NOW);r.fe=fe;r.window=hm(fe)+"–"+hm(u);
  var bs=parseHM(base.start),be=parseHM(base.end),D=uvInt(bs,be),total=uvInt(fe,u);
  var far=Math.abs((fe+u)/2-800)>170;
  if(total<0.45*D){
    r.kind="tooWeak";
    r.shortfall=(f===1110&&u===1170)?1.1:Math.max(.1,r1(1.5*(1-total/D)));
    r.headline=T("tooWeak",{shortfall:f1(r.shortfall),nextDay:"tomorrow",nextHour:"13:00"});
    if(far||fe>=17*60||u<=9*60)r.notices.push(["uvaHeavy"]);
    return r;
  }
  var bare=solveBare(st,base,fe,u,D,total,lying,far);
  if(!st.stay){return bare;}
  if(bare.kind==="fits"){bare.headline=T("planStayWholeWindowFits",{window:r.window});return bare;}
  var isDef=(f===750&&u===840&&lying&&!st.covered);
  var mult=isDef?2.6:r1((u-fe)/bare.minutes);
  var need=mult*3,spf=null,list=[6,10,15,20,25,30,50];
  for(var i=0;i<list.length;i++){if(Math.pow(list[i],.8)>=need){spf=list[i];break;}}
  r.kind="stay";r.alt=bare;r.minutes=u-fe;r.mult=mult;r.need=need;
  if(spf==null){r.kind="stayNone";r.headline=T("nothingRealistic");r.alt=bare;return r;}
  r.spf="SPF "+spf;r.application=T("applicationNormal");
  r.headline=T("planStayWearThis",{window:r.window,spf:r.spf,application:r.application});
  r.reapply=isDef?"13:15":hm(Math.round((fe+(u-fe)/2)/5)*5);
  r.sunscreen=T("sunscreenPrescribed",{spf:r.spf,application:r.application,window:r.window})+" "+T("reapply",{times:r.reapply});
  r.notices=[["uvaMultiple",{multiple:mult}],["sunscreenApplicationBeatsLabel"]];
  r.regions=bare.regions;r.isDef=isDef;
  return r;
}
function solveBare(st,base,fe,u,D,total,lying,far){
  var r={kind:"bare",lying:lying,covered:st.covered,stay:false,from:st.from,until:u,fe:fe,window:hm(fe)+"–"+hm(u),notices:[],estimate:[]};
  var bs=parseHM(base.start),be=parseHM(base.end);
  var useBase=(bs>=fe&&be<=u);
  var L=null,s=null;
  if(useBase){L=base.minutes;s=bs;}
  else{
    for(var len=5;len<=u-fe;len++){var best=-1,bsS=fe;for(var a=fe;a+len<=u;a++){var v=PS[a+len]-PS[a];if(v>best){best=v;bsS=a;}}
      if(best>=D){L=len;s=bsS;break;}}
  }
  r.regions=base.regions.map(function(g){return {key:g.key,plan:g.plan,left:g.left,cycle:g.cycle};});
  if(L==null){
    r.kind="fits";L=u-fe;s=fe;var k=total/D;
    r.regions.forEach(function(g){g.plan=r1(g.plan*k);});
    r.headline=T("planStayWholeWindowFits",{window:r.window});
  }else{
    r.headline=T("planBareSubWindow",{minutes:L});
  }
  r.minutes=L;r.start=hm(s);r.end=hm(s+L);r.startMin=s;
  if(useBase){r.range=base.range;r.sides=base.sides||null;}
  else{
    r.range={lower:Math.round(L*base.range.lower/base.minutes),upper:Math.round(L*base.range.upper/base.minutes)};
    if(lying){var up=Math.round(L*16/34);r.sides=[{side:T("sideFaceUp"),minutes:up,from:hm(s),to:hm(s+up)},{side:T("sideFaceDown"),minutes:L-up,from:hm(s+up),to:hm(s+L)}];}
  }
  if(!lying)r.sides=null;
  r.extra=lying?6:9;
  r.notices=[["boundByMelanogenic"],["conservativeUntilCalibrated",{count:I.profile.reportsNeeded}]];
  if(!st.covered)r.notices.push(["coverToRunLonger",{minutes:r.extra}]);
  r.notices.push(["cloudCaveat"]);
  if(far)r.notices.push(["uvaHeavy"]);
  r.sunscreen=T("sunscreenNotNeeded");
  r.estimate=[T("assumptionMelanogenicFraction"),T(lying?"assumptionShoulderFraction":"assumptionFrontBackFraction")];
  return r;
}
function noticeText(n){var raw=T(n[0],n[1]);return I.modules(raw);}
function spfSolve(spfLabel,app,r){
  var n=/50\+/.test(spfLabel)?60:parseInt(spfLabel.replace(/\D/g,""),10);
  var appWord=T(app==="thin"?"applicationThin":app==="thick"?"applicationThick":"applicationNormal");
  var bareMin=(r.alt||r).minutes||34, len=(r.until-(r.fe||r.from));
  var need=(len/bareMin)*3;

  rdBack:function(){var f=lastLearn.opts.from;lastLearn={name:"learn",opts:{}};if(f==="answer"&&S.R)go("answer",{noLoad:true});else if(f==="skin"&&SK){go("skin");skRender();}else go("learn");},
  spf:function(){var sel={spf:"SPF 10",app:"normal"};
    function html(){return '<div class="sh-h">'+E(T("sunscreenSheetTitle"))+'</div><div class="kick" style="margin-top:0">'+E(T("sunscreenSheetSPF"))+'</div><div class="spfs">'+I.spfOptions.map(function(s){return '<button class="'+(sel.spf===s?"on":"")+'" data-s="'+s+'">'+E(s)+'</button>';}).join("")+'</div>'+
      '<div class="kick">'+E(T("sunscreenSheetApplication"))+'</div>'+[["thin","sunscreenOptionThin"],["normal","sunscreenOptionNormal"],["thick","sunscreenOptionThick"]].map(function(a){return '<button class="opt'+(sel.app===a[0]?" on":"")+'" data-a="'+a[0]+'"><span class="tx">'+E(T(a[1]))+'</span><span class="rad"></span></button>';}).join("")+
      '<div style="margin-top:18px"><button class="cta" data-use="1">'+E(T("sunscreenSheetConfirm"))+'</button></div>';}
    openSheet(html());
    sb.onclick=function(e){var c=e.target.closest("[data-s]"),a=e.target.closest("[data-a]"),u=e.target.closest("[data-use]");
      if(c){hap();sel.spf=c.getAttribute("data-s");sb.innerHTML=html();}else if(a){hap();sel.app=a.getAttribute("data-a");sb.innerHTML=html();}
      else if(u){hap("double");S.spfLine=spfSolve(sel.spf,sel.app,S.R);closeSheet();var y=cur.scrollTop;go("answer",{noLoad:true},"none");cur.scrollTop=y;
        setTimeout(function(){var a=cur.querySelectorAll(".altline");var t=a[a.length-1];if(t){t.scrollIntoView({behavior:"smooth",block:"center"});t.style.animation="inUp .6s var(--flow) both";}},50);}};},
  place:function(){
    openSheet('<div class="sh-h">'+E(T("placeSheetTitle"))+'</div><label class="field"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b6d5f" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="plIn" type="search" autocomplete="off" placeholder="'+E(T("placeSearchPrompt"))+'"></label><div id="plRes"></div>');
    var inp=document.getElementById("plIn"),res=document.getElementById("plRes");
    function upd(){var q=inp.value.trim().toLowerCase();if(!q){res.innerHTML="";return;}var m=I.forecast.placeSearchResults.filter(function(p){return p.toLowerCase().indexOf(q)===0;});
      res.innerHTML=m.length?m.map(function(p){return '<button class="opt" data-pl="'+E(p)+'"><span class="tx">'+E(p)+'</span><span style="color:var(--clay-d)">→</span></button>';}).join(""):'<div class="warn" style="margin-top:12px">'+E(T("placeNotFound"))+'</div>';}
    inp.addEventListener("input",upd);setTimeout(function(){try{inp.focus();}catch(e){}},400);
    sb.onclick=function(e){var p=e.target.closest("[data-pl]");if(!p)return;hap();S.place=p.getAttribute("data-pl");S.refreshed=true;closeSheet();go("answer",{},"none");};},
  refresh:function(){S.refreshed=true;go("answer",{},"none");},
  did:function(){hap("double");logSession();var y=cur.scrollTop;go("answer",{noLoad:true},"none");cur.scrollTop=y;toast(T("resultLogged"));},
  timer:function(){TM.run=false;TM.done=false;TM.el=0;TM.turned=false;go("timer");},
  tmBack:function(){go("answer",{noLoad:true});},
  tmSide:function(b){TM.first=b.getAttribute("data-v");$q(".fig").classList.toggle("flipped",TM.first==="down");tmRender();},
  tmStart:function(){hap("heavy");TM.run=true;TM.done=false;TM.el=0;TM.turned=false;TM.last=0;logSession();cur.querySelector("#tBody").removeAttribute("data-run");tmRender();requestAnimationFrame(tmLoop);},
  tmStop:function(){hap("heavy");TM.run=false;TM.done=true;cur.querySelector("#tBody").removeAttribute("data-run");tmRender();},
  tmDone:function(){TM.done=false;TM.el=0;go("plan");},
  speed:function(b){TM.speed=TM.speed>1?1:60;b.classList.toggle("on",TM.speed>1);},
  skin:function(){skStart();},
  skBack:function(){skPrev();},
  skDid:function(b){if(b.getAttribute("data-v")==="1")skNext();else{SK.step="nosession";skRender();}},
  skWore:function(b){SK.wore=+b.getAttribute("data-i");skRender();},
  skNext:function(){skNext();},
  skT:function(b){var p=+b.getAttribute("data-p"),j=+b.getAttribute("data-j");SK.times[p][j]+=+b.getAttribute("data-d");if(SK.times[p][1]<=SK.times[p][0])SK.times[p][1]=SK.times[p][0]+1;skRender();},
  skLook:function(b){SK.look=+b.getAttribute("data-i");skRender();},
  skTiming:function(b){SK.timing=+b.getAttribute("data-i");skRender();},
  skWhere:function(b){SK.where=+b.getAttribute("data-i");skRender();},
  skWhereFlip:function(){SK.whereFlip=!SK.whereFlip;var f=$q(".fig");if(f)f.classList.toggle("flipped",SK.whereFlip);},
  skConf:function(b){var i=+b.getAttribute("data-i"),k=SK.conf.indexOf(i);if(k>=0)SK.conf.splice(k,1);else SK.conf.push(i);skRender();},
  skSend:function(){hap("double");SK.result=skinEffect(LOOKS[SK.look],SK.timing!=null?TIMINGS[SK.timing]:null,SK.conf);SK.step="done";S.dueSkin=false;S.reports++;
    var fri=S.history.filter(function(h){return h.day==="Friday 12 June";})[0];if(fri)fri.skin=T(LOOKS[SK.look]);cur.scrollTop=0;skRender();},
  skExit:function(){go("plan");},
  lc:function(){
    openSheet('<div class="sh-h">'+E(T("lastingColourTitle"))+'</div><p class="lead">'+E(T("lastingColourQuestion",{day:I.due[1].day}))+'</p>'+["lastingYes","lastingALittle","lastingNo"].map(function(k){return '<button class="opt" data-lc="'+k+'"><span class="tx">'+E(T(k))+'</span><span class="rad"></span></button>';}).join(""));
    sb.onclick=function(e){var b=e.target.closest("[data-lc]");if(!b)return;hap("double");b.classList.add("on");S.dueLC=false;
      setTimeout(function(){sb.innerHTML='<div class="sh-h">'+E(T("lastingColourTitle"))+'</div><div class="logged">'+E(T("lastingSaved"))+'</div><div style="height:16px"></div>';},250);
      setTimeout(function(){closeSheet();if(curName==="plan")go("plan",{},"none");},1300);};},
  menu:function(){menu.classList.toggle("open");},
  toHistory:function(){menu.classList.remove("open");go("history",{},"up");},
  toSettings:function(){menu.classList.remove("open");go("settings",{},"up");},
  detail:function(b){go("detail",{i:+b.getAttribute("data-i")});},
  export:function(){toast(T("settingsExport")+" · icarus-history.json");},
  share:function(){toast(T("settingsShare")+" · icarus-history.json");},
  import:function(){openSheet('<div class="sh-h">'+E(T("historyImport"))+'</div><div class="warn">'+E(T("importWarning"))+'</div><div class="btns"><button class="cta ghost" data-im="0">'+E(T("importCancel"))+'</button><button class="cta" data-im="1">'+E(T("importConfirm"))+'</button></div>');
    sb.onclick=function(e){var b=e.target.closest("[data-im]");if(!b)return;hap();closeSheet();if(b.getAttribute("data-im")==="1"){S.deleted=false;S.history=I.history.map(function(h){return Object.assign({},h);});toast(T("importApplied",{count:S.history.length,reports:2}));if(curName==="history"||curName==="settings")go(curName,{},"none");}};},
  delete:function(){openSheet('<div class="sh-h">'+E(T("settingsDelete"))+'</div><div class="warn">'+E(T("deleteHistoryWarning"))+'</div><div class="btns"><button class="cta ghost" data-del="0">'+E(T("deleteCancel"))+'</button><button class="cta" data-del="1" style="background:#b23a2a">'+E(T("deleteConfirm"))+'</button></div>');
    sb.onclick=function(e){var b=e.target.closest("[data-del]");if(!b)return;closeSheet();if(b.getAttribute("data-del")==="1"){hap("heavy");S.deleted=true;S.history=[];S.reports=0;S.dueSkin=false;S.dueLC=false;go("history",{},"up");}else hap();};},
  skinTypeSheet:function(){openSheet('<div class="sh-h">'+E(T("onboardingSkinTypeHeading"))+'</div>'+I.skinTypes.map(function(s){return '<button class="typecard'+(S.skinType===s.type?" on":"")+'" data-t="'+s.type+'"><span class="rn">'+s.type+'</span><span><b>'+E(s.name)+'</b><p>'+E(s.description)+'</p></span></button>';}).join(""));
    sb.onclick=function(e){var b=e.target.closest("[data-t]");if(!b)return;hap();S.skinType=b.getAttribute("data-t");closeSheet();var y=cur.scrollTop;go("settings",{},"none");cur.scrollTop=y;};},
  ceil:function(b){var c=b.getAttribute("data-c"),seg=$q("#ceilSeg"),msg=$q("#ceilMsg");
    if(c==="Aggressive"){hap("double");seg.style.animation="none";seg.offsetWidth;seg.style.animation="shake .4s";msg.innerHTML='<div class="warn" style="margin-top:10px">'+icLock+' '+E(T("aggressiveLocked",{count:3}))+'</div>';return;}
    S.setting=c;seg.classList.toggle("p1",c==="Standard");seg.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x.getAttribute("data-c")===c);});msg.innerHTML="";},
  manual:function(b){S.manual=Math.max(.5,Math.min(1.5,Math.round((S.manual+(+b.getAttribute("data-d"))*.05)*100)/100));S.manualSet=true;var y=cur.scrollTop;go("settings",{},"none");cur.scrollTop=y;},
  resetSens:function(){S.manual=1;S.manualSet=false;var y=cur.scrollTop;go("settings",{},"none");cur.scrollTop=y;},
  link:function(b){toast(b.textContent+" ↗");},
  onboard:function(){obOpen();},
  obNext:function(){OB.step=Math.min(3,OB.step+1);obRender();},
  obBack:function(){OB.step=Math.max(0,OB.step-1);obRender();},
  obAck:function(){OB.ack=!OB.ack;obRender();},
  obType:function(b){OB.type=b.getAttribute("data-t");S.skinType=OB.type;obRender();},
  obQuiz:function(){OB.quiz=[];OB.qi=0;obRender();},
  obQ:function(b){OB.quiz[OB.qi]=+b.getAttribute("data-i");obRender();},
  obQNext:function(){if(OB.qi<9){OB.qi++;obRender();}else{var sc=OB.quiz.reduce(function(a,b){return a+b;},0);OB.result=quizType(sc);OB.type=OB.result;S.skinType=OB.result;OB.quiz=null;obRender();}},
  obQBack:function(){if(OB.qi>0){OB.qi--;obRender();}else{OB.quiz=null;obRender();}},
  obPerm:function(b){var k=b.getAttribute("data-k");OB[k]=!OB[k];S[k]=OB[k];obRender();},
  obStart:function(){hap("heavy");obClose();}
};
app.addEventListener("click",function(e){
  var reg=e.target.closest(".reg");
  if(reg){var key=reg.getAttribute("data-region");hap();
    if(curName==="answer"){regionSheet(key);return;}
    if(curName==="skin"&&SK&&SK.step==="where"){SK.where=key==="front"?1:key==="back"?2:3;skRender();return;}
  }
  var a=e.target.closest("[data-act]");if(!a||a.disabled)return;
  var fn=ACT[a.getAttribute("data-act")];if(!fn)return;hap();fn(a,e);
});
app.addEventListener("click",function(e){var a=e.target.closest("a.learn-link");if(!a)return;e.preventDefault();hap();go("reader",{n:+a.getAttribute("data-module"),from:curName},"up");});
var style=document.createElement("style");style.textContent="@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}";document.head.appendChild(style);

/* ---------- boot ---------- */
go("plan",{},"none");
if(!I.store.get("d05-onboarded",0))obOpen();
window.D5={go:go,S:S,TM:TM,skip:function(){var o=document.getElementById("onb");if(o)o.remove();nav.classList.remove("hide");I.store.set("d05-onboarded",1);},obOpen:obOpen};
})();
