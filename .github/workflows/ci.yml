name: CI

# Fast checks on every push to main (agents run them locally before merging;
# this is the backstop). A newer push cancels the stale run.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # iOS builds need macOS; they run in nightly.yml. Here: format and lint only.
      - name: Format
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/nicklockwood/swiftformat:0.64.4 --lint .
      - name: Lint
        run: docker run --rm -v "$PWD:/src" -w /src ghcr.io/realm/swiftlint:0.65.1 lint --strict --quiet

  # The pure-Swift part of the package (IcarusCore, IcarusContent, IcarusData;
  # Package.swift leaves the Apple-only targets out on Linux) and the scripted
  # success criteria, in the official Swift image (D-2026-09-03-F6).
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.0.3-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-6.0.3-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: swift-6.0.3-
      - name: Engine, content and data tests
        run: swift test
      - name: Scripted success criteria
        run: for s in acceptance/S*.sh; do "$s"; done
