name: Screenshots

# Runs the app in a simulator on the preview environment and uploads a
# screenshot of every main screen as the run's artifact, so the screens can be
# looked at without a Mac. By hand only: gh workflow run screenshots.yml --ref <branch>
on:
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    # A clean walk with the dark and largest-text shots takes about 20 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install xcodegen
      - run: xcodegen generate
      # Runner images differ in which simulators they carry, and some carry
      # none until the platform is downloaded: take the iPhone that is there.
      - name: Pick a simulator
        id: sim
        run: echo "udid=$(.github/scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"
      # One run (40941378554) built, then sat 43 minutes without starting a
      # test: boot the simulator first, so a stuck boot fails here, fast.
      - name: Boot the simulator
        timeout-minutes: 10
        run: xcrun simctl bootstatus '${{ steps.sim.outputs.udid }}' -b
      # The tests attach the screenshots; a failed step still has the ones
      # taken before it, so the export runs either way.
      - name: Walk the screens
        timeout-minutes: 40
        run: >
          xcodebuild test
          -project ProjectIcarus.xcodeproj
          -scheme Screenshots
          -destination 'id=${{ steps.sim.outputs.udid }}'
          -resultBundlePath Screenshots.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Export the screenshots
        if: always()
        run: |
          mkdir -p raw screenshots
          xcrun xcresulttool export attachments --path Screenshots.xcresult --output-path raw
          # manifest.json maps each exported file to the name the test gave it.
          # Xcode adds its own on a failure ("Debug description for ..."):
          # those keep a name the artifact store accepts and sort last.
          jq -r '.[].attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' raw/manifest.json |
            while IFS=$'\t' read -r file name; do
              case "$name" in
                [0-9][0-9]-*) cp "raw/$file" "screenshots/${name%%_*}.png" ;;
                *) cp "raw/$file" "screenshots/zz-$(printf '%s' "${name%.*}" | tr -c 'A-Za-z0-9._-' '-').${file##*.}" ;;
              esac
            done
          ls screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn
