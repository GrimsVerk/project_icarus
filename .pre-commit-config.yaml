# Enable with: pre-commit install
# Needs the tools installed: brew install swiftformat swiftlint
repos:
  - repo: local
    hooks:
      - id: swiftformat
        name: swiftformat (lint)
        entry: swiftformat --lint
        language: system
        types: [swift]
      - id: swiftlint
        name: swiftlint
        entry: swiftlint lint --strict --quiet
        language: system
        types: [swift]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
