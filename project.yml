# Human-readable Xcode project spec (XcodeGen). The .xcodeproj is generated
# from this file with `xcodegen generate` and is never committed or hand-edited.
name: ProjectIcarus
options:
  bundleIdPrefix: com.example # change before building for a device or distributing
  deploymentTarget:
    iOS: "17.0"
targets:
  ProjectIcarus:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ProjectIcarusTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ProjectIcarus
schemes:
  ProjectIcarus:
    build:
      targets:
        ProjectIcarus: all
    test:
      targets:
        - ProjectIcarusTests
