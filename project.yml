# Human-readable Xcode project spec (XcodeGen). The .xcodeproj is generated
# from this file with `xcodegen generate` and is never committed or hand-edited.
name: ProjectIcarus
options:
  bundleIdPrefix: com.example # change before building for a device or distributing
  deploymentTarget:
    iOS: "18.0"
packages:
  Icarus:
    path: "."
targets:
  ProjectIcarus:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: Icarus
        product: IcarusUI
      - package: Icarus
        product: IcarusContent
    # Generated at `xcodegen generate` and merged with the generated keys below.
    # It holds what no INFOPLIST_KEY_ setting can: the icarus:// scheme the
    # Learn deep links use (R27, DeepLink.scheme).
    info:
      path: App/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: learn
            CFBundleURLSchemes: [icarus]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ProjectIcarusTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/AppTests]
    dependencies:
      - target: ProjectIcarus
  # Walks the app on the preview environment and attaches a screenshot of every
  # main screen. Its own scheme, run by .github/workflows/screenshots.yml; the
  # nightly test run leaves it out.
  ProjectIcarusScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/Screenshots]
    dependencies:
      - target: ProjectIcarus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ProjectIcarus
schemes:
  ProjectIcarus:
    build:
      targets:
        ProjectIcarus: all
    test:
      targets:
        - ProjectIcarusTests
        - package: Icarus/IcarusCoreTests
        - package: Icarus/IcarusDataTests
        - package: Icarus/IcarusContentTests
        - package: Icarus/IcarusUITests
        - package: Icarus/IcarusAdsTests
  Screenshots:
    build:
      targets:
        ProjectIcarus: all
    test:
      config: Debug
      targets:
        - ProjectIcarusScreenshots
